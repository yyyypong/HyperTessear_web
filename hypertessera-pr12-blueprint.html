    // ---------- Settlement Operator 工作台（Settlement 合约 per-vault operator，M-of-N eth_sign） ----------
    function demoInstrHash(vaultId, data) {
      const base = vaultId + ':' + data.cycle + ':' + data.depositTotal + ':' + data.redeemTotal;
      let out = '', h = 2166136261;
      for (let round = 0; round < 8; round++) {
        for (let i = 0; i < base.length; i++) h = Math.imul(h ^ base.charCodeAt(i), 16777619) >>> 0;
        out += h.toString(16).padStart(8, '0');
        h = (h + Math.imul(round + 1, 0x9e3779b9)) >>> 0;
      }
      return '0x' + out.slice(0, 64);
    }
    function settleInstructionHash(vaultId) { return demoInstrHash(vaultId, settlementDemoData(vaultId)); }

    function settlementOperatorWorkspace(vaultId) {
      const vault = vaultById(vaultId) || VAULTS[0];
      const ops = getSettlementOps(vault.id);
      const me = myAddr();
      const isOp = ops.operators.includes(me);
      const isOwner = vault.owner === me;
      const data = settlementDemoData(vault.id);
      const hash = settleInstructionHash(vault.id);
      const sigs = (state.settlementOps[vault.id] && state.settlementOps[vault.id].signatures[hash]) || [];
      const enough = sigs.length >= ops.threshold && ops.threshold > 0;
      const distribution = Math.min(Math.max(data.redeemTotal - data.depositTotal, 0), data.poolAvailable);
      const fmt = at => new Date(at).toLocaleString('zh-CN', { month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' });
      return `${publicHeader('vaults')}<main class="page">
        <div class="workspace-shell">${roleSidebar('settlement-operator', vault.id)}<section class="workspace-main stack">
          <div class="page-head"><div><div class="eyebrow">${vault.symbol} · Settlement Operator workspace</div><h1>${escapeHtml(vault.name)} <span class="mono quiet" style="font-size:18px">${vault.symbol}</span></h1><p>Settlement 合约的 per-vault operator：读队列深度与 NAV → FIFO 选前缀算轧差 → eth_sign 签名（M-of-N）→ 提交 submitBatch。</p></div><div class="row"><span class="badge ${isOp ? 'success' : 'neutral'}">${isOp ? '★ 我是 operator' : '非 operator'}</span><span class="badge">${ops.threshold}-of-${ops.operators.length} 多签</span></div></div>
          <div class="card card-pad" style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><span class="small muted">切换要结算的金库：</span>${VAULTS.map(v => `<button class="btn small ${v.id === vault.id ? '' : 'secondary'}" data-route="#/workspace/settlement-operator/${v.id}">${v.symbol}</button>`).join('')}</div>
          ${!isOp ? `<div class="op-alert" style="margin-bottom:4px">你当前不是本金库的 Settlement Operator，以下为只读视图。需 Vault Owner 通过 <span class="mono">setOperator(vault, 地址, true)</span> 任命你。</div>` : ''}
          <div class="grid four">
            <div class="stat card"><div class="stat-label"><span class="dot"></span>当前周期</div><div class="stat-value">#${data.cycle}</div><div class="stat-foot">阶段 ${data.phase}</div></div>
            <div class="stat card"><div class="stat-label"><span class="dot warning"></span>申购队列（FIFO）</div><div class="stat-value">${data.deposit.length}</div><div class="stat-foot">合计 ${data.depositTotal.toLocaleString()} USDT</div></div>
            <div class="stat card"><div class="stat-label"><span class="dot"></span>赎回队列（FIFO）</div><div class="stat-value">${data.redeem.length}</div><div class="stat-foot">合计 ${data.redeemTotal.toLocaleString()} USDT</div></div>
            <div class="stat card"><div class="stat-label"><span class="dot success"></span>UnifiedPool 可用</div><div class="stat-value" style="font-size:20px">${data.poolAvailable.toLocaleString()}</div><div class="stat-foot">cap ${data.cap.toLocaleString()} · NAV ${data.nav}</div></div>
          </div>
          <article class="card card-pad"><div class="section-title"><h3>① 队列浏览器（FIFO）</h3><span class="badge neutral">来自 Indexer API</span></div>
            <p class="small muted" style="margin-bottom:12px">按入队顺序从队头取前缀：depositRequestIds / redeemRequestIds。真实实现从 indexer 读取每条请求的深度与状态。</p>
            <div class="grid two" style="gap:16px">
              <div><div class="small strong" style="margin-bottom:6px">申购队列（PENDING）</div><div class="table-wrap"><table><thead><tr><th>#</th><th>请求 ID</th><th>用户</th><th>金额</th></tr></thead><tbody>${data.deposit.map((x, i) => `<tr><td class="mono small">${i + 1}</td><td class="mono small">${x.id}</td><td class="small">${x.from}</td><td class="mono small">${Number(x.amount).toLocaleString()}</td></tr>`).join('')}</tbody></table></div></div>
              <div><div class="small strong" style="margin-bottom:6px">赎回队列（PENDING）</div><div class="table-wrap"><table><thead><tr><th>#</th><th>请求 ID</th><th>用户</th><th>金额</th></tr></thead><tbody>${data.redeem.map((x, i) => `<tr><td class="mono small">${i + 1}</td><td class="mono small">${x.id}</td><td class="small">${x.from}</td><td class="mono small">${Number(x.amount).toLocaleString()}</td></tr>`).join('')}</tbody></table></div></div>
            </div>
          </article>
          <article class="card card-pad"><div class="section-title"><h3>② 轧差计算器</h3><span class="badge neutral">SettlementInstruction</span></div>
            <div class="grid four">
              <div class="stat card"><div class="stat-label">申购合计</div><div class="stat-value" style="font-size:20px">${data.depositTotal.toLocaleString()}</div></div>
              <div class="stat card"><div class="stat-label">赎回合计</div><div class="stat-value" style="font-size:20px">${data.redeemTotal.toLocaleString()}</div></div>
              <div class="stat card"><div class="stat-label">轧差净额</div><div class="stat-value" style="font-size:20px">${data.net.toLocaleString()}</div></div>
              <div class="stat card"><div class="stat-label">应付 distribution</div><div class="stat-value" style="font-size:20px">${distribution.toLocaleString()}</div><div class="stat-foot">受可用资金约束</div></div>
            </div>
            <p class="small quiet" style="margin-top:12px">轧差净额 = 赎回合计 − 申购合计；distribution.amount 取「轧差净额」与「UnifiedPool 可用资金」的较小值（资金守恒）。若链上 revert（超 AUM / 流动性不足），缩小前缀重来。</p>
          </article>
          <article class="card card-pad"><div class="section-title"><h3>③ 签名收集（${ops.threshold}-of-${ops.operators.length}，eth_sign）</h3><span class="badge ${enough ? 'success' : 'warning'}">${sigs.length}/${ops.threshold} 已签</span></div>
            <p class="small muted" style="margin-bottom:10px">指令哈希：<span class="mono small">${hash}</span></p>
            <div class="req-list" style="margin-bottom:12px">${ops.operators.map(addr => { const signed = sigs.includes(addr); return `<div class="req-item"><div class="req-main"><h4>${holderName(addr)}</h4><p class="small muted mono">${addr}</p></div>${signed ? '<span class="badge success">已签名</span>' : '<span class="badge neutral">待签名</span>'}</div>`; }).join('') || '<div class="small muted">尚未任命任何 operator</div>'}</div>
            ${isOp ? `<div class="row wrap">${sigs.includes(me) ? '<span class="badge success">你已签名</span>' : `<button class="btn small" data-settle-sign="${vault.id}">对指令做 eth_sign 签名</button>`}<button class="btn small ${enough ? '' : 'secondary'}" data-settle-submit="${vault.id}" ${enough ? '' : 'disabled'}>提交 submitBatch</button><button class="btn small secondary" data-settle-final="${vault.id}">confirmFinalSettlement</button></div>` : '<span class="badge neutral">非 operator：仅可只读查看</span>'}
            <p class="small quiet" style="margin-top:10px">签名可分别完成，不要求同时在线；凑够 threshold 后任意 operator（或 relayer）可提交。confirmFinalSettlement 仅 operator 可执行（KeeperBot 无 operator 私钥，不可代做）。</p>
          </article>
          <article class="card card-pad"><div class="section-title"><h3>④ 历史结算记录</h3><span class="badge">${ops.history.length}</span></div>
            <div class="table-wrap"><table><thead><tr><th>时间</th><th>周期</th><th>指令哈希</th><th>轧差净额</th><th>签名</th></tr></thead><tbody>${ops.history.length ? ops.history.map(h => `<tr><td class="mono small">${fmt(h.at)}</td><td class="mono small">#${h.cycle}</td><td class="mono small">${h.hash.slice(0, 14)}…</td><td class="mono small">${Number(h.net).toLocaleString()}</td><td class="small">${h.signers}/${h.threshold} 签</td></tr>`).join('') : '<tr><td colspan="5" class="empty" style="padding:26px">暂无历史结算记录。</td></tr>'}</tbody></table></div>
          </article>
          ${isOwner ? `<article class="card card-pad"><div class="section-title"><h3>管理 Operator（Vault Owner）</h3><span class="badge neutral">setOperator / setThreshold</span></div><p class="small muted" style="margin-bottom:12px">Settlement 合约自己管理 per-vault operator（不在 IVaultRoles 里）。Vault Owner 可任命 / 移除 operator 并调整多签阈值。</p><form id="settle-ops-form" class="grid two" style="gap:14px"><input type="hidden" name="vaultId" value="${vault.id}"><div class="field"><label>operator 地址</label><input class="input mono small" name="opAddr" placeholder="0x… 任命或留空移除"></div><div class="field"><label>多签阈值 threshold</label><input class="input small" name="threshold" type="number" min="1" value="${ops.threshold || 1}"></div><button class="btn" type="submit" style="grid-column:1/-1;justify-self:start">保存 operator 配置</button></form></article>` : ''}
        </section></div>
      </main>`;
    }

    // 金库角色工作台：左侧 roleSidebar + 右侧（capability / stat 卡 / 可执行操作 / 角色表单 / 最近 Activity）
    function vaultRoleWorkspace(roleId, vaultId) {
      const vault = vaultById(vaultId) || VAULTS[0];
      if (roleId === 'settlement-operator') return settlementOperatorWorkspace(vault.id);
      const role = ROLES[roleId];
      const missing = missingRoles('vaults', vault.id, VAULT_REQUIRED_ROLES);
      if (missing.length) return renderVaultAppointmentGate(vault, roleId, missing);
      const isOwner = vault.owner === shortAddress(wallet().address);
      const navRec = vault.assetId ? state.navRecords[vault.assetId] : null;
      const actions = vaultRoleActions(roleId, vault);
      const vaultActivities = state.activities.filter(a => (a.text || '').includes(vault.symbol) || (a.text || '').includes(vault.name)).slice(0, 5);
      const todoCount = Math.min(actions.length + (vault.status === 'submitted' ? 1 : 0), 5);
      return `${publicHeader('vaults')}<main class="page">
        <div class="workspace-shell">${roleSidebar(roleId, vault.id)}<section class="workspace-main stack">
          <div class="page-head"><div><div class="eyebrow">${vault.symbol} · ${role.label} workspace</div><h1>${escapeHtml(vault.name)} <span class="mono quiet" style="font-size:18px">${vault.symbol}</span></h1><p>${role.summary}</p></div><div class="row"><span class="badge success">权限已确认</span></div></div>
          <div class="capability card"><div class="row between wrap"><div><strong>权限来源</strong><div class="small muted" style="margin-top:4px">${networkLabel()} · ${shortAddress(wallet().address)} · <span class="mono">${vault.address}</span></div></div><div class="row wrap">${statusBadge(vault.status === 'listed' ? 'listed' : vault.status === 'submitted' ? 'submitted' : 'pending')}<span class="role-chip">${vault.type}</span>${isOwner ? '<span class="badge success">Owner</span>' : ''}</div></div></div>
          <div class="grid four">
            <div class="stat card"><div class="stat-label"><span class="dot warning"></span>待办任务</div><div class="stat-value">${todoCount}</div><div class="stat-foot">按紧急度排序</div></div>
            <div class="stat card"><div class="stat-label"><span class="dot"></span>可执行操作</div><div class="stat-value">${actions.length}</div><div class="stat-foot">当前角色</div></div>
            <div class="stat card"><div class="stat-label"><span class="dot success"></span>今日交易</div><div class="stat-value">${vaultActivities.length}</div><div class="stat-foot">本金库 Activity</div></div>
            <div class="stat card"><div class="stat-label"><span class="dot"></span>最新 NAV</div><div class="stat-value" style="font-size:20px">${navRec ? navRec.nav : vault.nav}</div><div class="stat-foot">${navRec ? '来自 NAVOracle' : '演示默认值'}</div></div>
          </div>
          <article class="card card-pad"><div class="section-title"><h3>可执行操作</h3><span class="badge neutral">合约映射</span></div><div class="action-list">${actions.map(a => `<div class="action-row"><div><h4>${a.h}</h4><p>${a.p}</p></div>${a.btn}</div>`).join('')}</div></article>
          ${roleId === 'vault-owner' ? `<section class="card card-pad" id="vault-roles"><div class="section-title"><h3>IVaultRoles · 金库角色管理</h3><span class="badge neutral">${isOwner ? 'Owner 可编辑' : '只读'}</span></div>
            <p class="small muted" style="margin-bottom:14px">BaseVault（IVaultRoles）：transferOwnership / setCurator / setGuardian / setAllocator / setKeeper 均仅 Owner 可调（_onlyOwner）。Curator 的策略配置（addAdapter / setPerformanceFeeBps 等）在 CONFIGURING 阶段由 Owner 直调，此后需经 VaultTimelock 执行。</p>
            <form id="vault-roles-form" class="grid two" style="gap:14px">
              <div class="field"><label for="vr-curator">Curator <span class="small muted">setCurator</span></label><input id="vr-curator" class="input mono small" name="curator" placeholder="0x…（留空 = 不设置）" value="${vault.curator || ''}" ${isOwner ? '' : 'disabled'}></div>
              <div class="field"><label for="vr-guardian">Guardian <span class="small muted">setGuardian</span></label><input id="vr-guardian" class="input mono small" name="guardian" placeholder="0x…（留空 = 不设置）" value="${vault.guardian || ''}" ${isOwner ? '' : 'disabled'}></div>
              <div class="field"><label for="vr-allocator">Allocator <span class="small muted">setAllocator</span></label><input id="vr-allocator" class="input mono small" name="allocator" placeholder="0x…（留空 = 不设置）" value="${vault.allocator || ''}" ${isOwner ? '' : 'disabled'}></div>
              <div class="field"><label for="vr-keeper">Keeper <span class="small muted">setKeeper</span></label><input id="vr-keeper" class="input mono small" name="keeper" placeholder="0x…（留空 = 不设置）" value="${vault.keeper || ''}" ${isOwner ? '' : 'disabled'}></div>
              <div class="field" style="grid-column:1/-1"><label for="vr-new-owner">新 Owner <span class="small muted">transferOwnership</span></label><input id="vr-new-owner" class="input mono small" name="newOwner" placeholder="0x…（留空 = 不变更）" ${isOwner ? '' : 'disabled'}></div>
              ${isOwner ? '<button class="btn" type="submit" style="justify-self:start">提交角色变更</button>' : '<span class="badge neutral" style="align-self:center">非 Owner：只读视图</span>'}
            </form>
          </section>` : `<article class="card card-pad"><div class="section-title"><h3>策略配置说明</h3><span class="badge neutral">VaultTimelock</span></div><p class="small muted">Curator 由 Vault Owner 通过 setCurator 任命后即可在本工作台发起策略与费用配置。变更在 CONFIGURING 之后需经金库专属 VaultTimelock 排队执行，本演示以 Toast 记录代替真实排队。</p></article>`}
          <article class="card card-pad"><div class="section-title"><h3>最近 Activity</h3><span class="small quiet">仅展示本金库相关记录</span></div>${activityTable(vaultActivities)}</article>
        </section></div>
      </main>`;
    }

    // ---------- 资产角色工作台（对齐金库工作台样式：左侧角色侧栏 + 右侧操作面板） ----------
    // 默认角色 = 当前钱包在指定资产下已任命角色（逐对象派生），无任命时回退 asset-owner（owner 为注册固有身份）
    function defaultAssetRole(assetId) {
      const mine = walletRoleEntries().filter(en => en.kind === 'asset' && (assetId == null || en.id === Number(assetId)));
      return mine[0]?.roleId || 'asset-owner';
    }

    function assetRoleSidebar(activeRole, assetId) {
      const me = myAddr();
      const appointed = assetAppointedRoles(assetId);
      return `<aside class="sidebar card"><div class="side-section"><div class="side-label">业务页面</div><button class="side-link" data-route="#/issuance/issue">发行总览</button><button class="side-link" data-route="#/access">My Access</button></div><div class="side-section"><div class="side-label">本资产已任命角色</div>${appointed.length ? appointed.map(r => `<button class="side-link ${r.roleId === activeRole ? 'active' : ''}" data-route="#/assets/workspace/${assetId}/${r.roleId}">${ROLES[r.roleId].label}<small>${ROLES[r.roleId].contract.split('（')[0]} · ${holderName(r.address)}${r.address === me ? ' · ★我持有' : ''}</small></button>`).join('') : '<div class="small muted" style="padding:10px">尚未任命任何角色</div>'}</div></aside>`;
    }

    // 资产域角色可执行操作（按角色生成，映射 PR#12 合约）
    function assetRoleActions(roleId, asset) {
      const isOwner = asset.owner === shortAddress(wallet().address);
      const actions = [];
      if (roleId === 'asset-owner') {
        actions.push({ h: '发起 Mint / Burn 双签', p: 'Issuer（ownerOf 匹配）· initiateMint / initiateBurn，待 Token Agent 第二签名', btn: `<button class="btn small" data-route="#/assets/mintburn/${asset.id}">去双签工作台</button>` });
        actions.push({ h: '更新元数据哈希', p: 'AssetRegistry.updateMetadataHash · onlyOwner', btn: isOwner ? '<button class="btn small secondary" data-toast="演示：updateMetadataHash 已记录 Activity">演示更新</button>' : '<span class="badge neutral">非 Owner</span>' });
        actions.push({ h: '任命 Token Agent', p: 'MintBurnController.setTokenAgent · 仅 Owner，指定双签第二签名地址', btn: isOwner ? '<button class="btn small secondary" data-toast="演示：setTokenAgent 已记录 Activity">演示任命</button>' : '<span class="badge neutral">非 Owner</span>' });
        actions.push({ h: '任命 Proof Publisher', p: 'PoRRegistry.setProofPublisher · 仅 Owner，授权专用发布地址', btn: isOwner ? '<button class="btn small secondary" data-toast="演示：setProofPublisher 已记录 Activity">演示任命</button>' : '<span class="badge neutral">非 Owner</span>' });
      } else if (roleId === 'token-agent') {
        actions.push({ h: '批准 Mint', p: 'MintBurnController.approveMint · 第二签名', btn: `<button class="btn small" data-route="#/assets/mintburn/${asset.id}">去双签工作台</button>` });
        actions.push({ h: '批准 Burn', p: 'MintBurnController.approveBurn · 第二签名', btn: `<button class="btn small secondary" data-route="#/assets/mintburn/${asset.id}">去双签工作台</button>` });
      } else if (roleId === 'proof-publisher') {
        actions.push({ h: '发布储备证明', p: 'PoRRegistry.publishReserveProof · 追加式记录', btn: '<button class="btn small" data-route="#/assets/por">去发布</button>' });
        actions.push({ h: '更新证明引用', p: 'PoRRegistry · 更新文档 URI / 哈希引用', btn: '<button class="btn small secondary" data-toast="演示：证明引用更新已记录 Activity">演示更新</button>' });
      } else if (roleId === 'wrapper-controller') {
        actions.push({ h: '部署包装代币', p: 'ReservePSM.deployWrappedToken · 部署者即 Wrapper Controller', btn: '<button class="btn small" data-route="#/assets/wrap">去配置</button>' });
        actions.push({ h: '暂停 / 恢复包装', p: 'ReservePSM.pauseAsset · 仅 Wrapper Controller', btn: '<button class="btn small secondary" data-toast="演示：pauseAsset 已记录 Activity">演示暂停</button>' });
        actions.push({ h: '设置授权签名人', p: 'ReservePSM.setAuthorizedSigner · 任命 PSM Authorized Signer', btn: '<button class="btn small secondary" data-toast="演示：setAuthorizedSigner 已记录 Activity">演示任命</button>' });
      } else if (roleId === 'nav-signer') {
        actions.push({ h: '创建 / 提交 NAV 更新', p: 'NAVOracle.updateNAV · EIP-712 签名后提交', btn: '<button class="btn small" data-route="#/assets/oracle">去提交</button>' });
      } else if (roleId === 'adapter-data-provider') {
        actions.push({ h: '提交外部数据', p: 'CreditAdapter.updateDealData · DATA_PROVIDER_ROLE', btn: '<button class="btn small" data-toast="演示：updateDealData 已记录 Activity">演示提交</button>' });
        actions.push({ h: '更新数据有效期', p: 'CreditAdapter · 延长 deal 数据有效期', btn: '<button class="btn small secondary" data-toast="演示：数据有效期更新已记录 Activity">演示更新</button>' });
      } else if (roleId === 'psm-authorized-signer') {
        actions.push({ h: '签署铸币授权', p: 'ReservePSM.mintWithAuthorization · Document Proof 模式', btn: '<button class="btn small" data-route="#/assets/wrap">去签署</button>' });
      } else if (roleId === 'relayer') {
        actions.push({ h: '转发授权消息', p: 'Offchain Relayer · 转发并跟踪交付', btn: '<button class="btn small" data-toast="演示：授权消息已转发">演示转发</button>' });
        actions.push({ h: '重试失败消息', p: 'Offchain Relayer · 重试未交付消息', btn: '<button class="btn small secondary" data-toast="演示：失败消息重试已记录">演示重试</button>' });
      }
      return actions;
    }

    // 资产角色工作台：任命门控（未完成任命时只显示任命表单）
    function renderAssetAppointmentGate(asset, roleId, missing) {
      const ap = getAppointments('assets', asset.id);
      return `${publicHeader('issuance', 'workspace')}<main class="page">
        <div class="workspace-shell">${assetRoleSidebar(roleId, asset.id)}<section class="workspace-main stack">
          <div class="page-head"><div><div class="eyebrow">${asset.symbol} · 角色任命</div><h1>${escapeHtml(asset.name)} <span class="mono quiet" style="font-size:18px">${asset.symbol}</span></h1><p>新注册资产必须先完成全部角色任命，才能开放 Mint/Burn、储备证明、包装等任何操作。</p></div><div class="row"><span class="badge warning">任命未完成</span></div></div>
          <div class="op-alert" style="margin-bottom:16px">⚠ 还有 ${missing.length} 个角色未任命。在全部任命完成前，本资产不显示任何其他操作按钮。</div>
          <section class="card card-pad"><div class="section-title"><h3>第一步 · 任命资产角色</h3><span class="badge warning">必完成 ${ASSET_REQUIRED_ROLES.length} 项</span></div>
            <p class="small muted" style="margin-bottom:14px">Asset Owner 通过以下 setX 函数任命各角色；全部任命完成后工作台才会开放对应操作。</p>
            <form id="asset-appoint-form" class="grid two" style="gap:14px">
              ${ASSET_REQUIRED_ROLES.map(r => `<div class="field"><label for="ap-${r.key}">${r.label} * <span class="small muted">${r.fn}</span></label><input id="ap-${r.key}" class="input mono small" name="${r.key}" placeholder="0x… 任命地址" value="${ap[r.key] || ''}" required><p class="small quiet" style="margin-top:4px">${r.hint}</p></div>`).join('')}
              <button class="btn" type="submit" style="grid-column:1/-1;justify-self:start">确认任命</button>
            </form>
          </section>
        </section></div>
      </main>`;
    }

    // 金库角色工作台：任命门控（未完成任命时只显示任命表单）
    function renderVaultAppointmentGate(vault, roleId, missing) {
      const ap = getAppointments('vaults', vault.id);
      return `${publicHeader('vaults')}<main class="page">
        <div class="workspace-shell">${roleSidebar(roleId, vault.id)}<section class="workspace-main stack">

      const assetActivities = state.activities.filter(a => (a.text || '').includes(asset.symbol) || (a.text || '').includes(asset.name)).slice(0, 5);
      const todoCount = Math.min(actions.length, 5);

        <div class="workspace-shell">${assetRoleSidebar(roleId, asset.id)}<section class="workspace-main stack">

            <div class="stat card"><div class="stat-label"><span class="dot warning"></span>待办任务</div><div class="stat-value">${todoCount}</div><div class="stat-foot">按紧急度排序</div></div>
            <div class="stat card"><div class="stat-label"><span class="dot"></span>可执行操作</div><div class="stat-value">${actions.length}</div><div class="stat-foot">当前角色</div></div>
            <div class="stat card"><div class="stat-label"><span class="dot success"></span>今日交易</div><div class="stat-value">${assetActivities.length}</div><div class="stat-foot">本资产 Activity</div></div>
            <div class="stat card"><div class="stat-label"><span class="dot"></span>最新 NAV</div><div class="stat-value" style="font-size:20px">${navRec ? navRec.nav : asset.nav}</div><div class="stat-foot">${navRec ? '来自 NAVOracle' : '演示默认值'}</div></div>

          ${roleId === 'asset-owner' ? `<section class="card card-pad" id="asset-roles"><div class="section-title"><h3>AssetRegistry · 资产角色管理</h3><span class="badge neutral">${isOwner ? 'Owner 可编辑' : '只读'}</span></div>
            <p class="small muted" style="margin-bottom:14px">AssetRegistry / MintBurnController / PoRRegistry：setTokenAgent / setProofPublisher / updateMetadataHash / transferAssetOwnership 均仅 Owner 可调。Mint 双签由 Issuer 发起、Token Agent 批准。</p>

              <div class="field"><label for="ar-token-agent">Token Agent <span class="small muted">setTokenAgent</span></label><input id="ar-token-agent" class="input mono small" name="tokenAgent" placeholder="0x…（留空 = 不设置）" ${isOwner ? '' : 'disabled'}></div>
              <div class="field"><label for="ar-proof-publisher">Proof Publisher <span class="small muted">setProofPublisher</span></label><input id="ar-proof-publisher" class="input mono small" name="proofPublisher" placeholder="0x…（留空 = 不设置）" ${isOwner ? '' : 'disabled'}></div>
              <div class="field"><label for="ar-metadata">新 metadataHash <span class="small muted">updateMetadataHash</span></label><input id="ar-metadata" class="input mono small" name="metadataHash" placeholder="0x…（留空 = 不变更）" ${isOwner ? '' : 'disabled'}></div>
              <div class="field"><label for="ar-new-owner">新 Owner <span class="small muted">transferAssetOwnership</span></label><input id="ar-new-owner" class="input mono small" name="newOwner" placeholder="0x…（留空 = 不变更）" ${isOwner ? '' : 'disabled'}></div>
              ${isOwner ? '<button class="btn" type="submit" style="justify-self:start">提交角色变更</button>' : '<span class="badge neutral" style="align-self:center">非 Owner：只读视图</span>'}

    // =====================================================================

    function renderApp() {
      const path = currentPath();
      const root = document.getElementById('root');
      const mManage = path.match(/^#\/assets\/manage\/(\d+)$/);
      const mAssetWs = path.match(/^#\/assets\/workspace\/(\d+)(?:\/([^/]+))?$/);
      const mMint = path.match(/^#\/assets\/mintburn\/(\d+)$/);
      const mVault = path.match(/^#\/vaults\/manage\/([^/]+)$/);
      const mWs = path.match(/^#\/workspace\/([^/]+)\/([^/]+)$/);
      let html;
      if (path === '#/' || path === '') html = renderHome();
      else if (path === '#/blueprint') html = renderBlueprint();
      else if (path === '#/products') html = renderProducts();
      else if (path === '#/access') html = renderAccess();
      else if (path === '#/issuance' || path === '#/issuance/issue') html = renderIssueCenter();
      else if (path === '#/assets/register') html = renderRegister();
      else if (path === '#/assets/manage') html = renderManageAssets();
      else if (mManage) html = renderAssetDetail(mManage[1]);
      else if (mAssetWs) html = assetRoleWorkspace(mAssetWs[2] || defaultAssetRole(mAssetWs[1]), mAssetWs[1]);
      else if (mMint) html = renderMintBurn(mMint[1]);
      else if (path === '#/assets/oracle') html = renderOracle();
      else if (path === '#/assets/por') html = renderPor();
      else if (path === '#/assets/wrap') html = renderWrap();
      else if (path === '#/assets/wrapped') html = renderWrapped();
      else if (path === '#/vaults') html = renderVaultsHub();
      else if (path === '#/vaults/create') html = renderCreateVault();
      else if (path === '#/vaults/manage') html = renderVaultList();
      else if (mVault) html = renderVaultDetail(mVault[1]);
      else if (path === '#/ops/login') html = renderOpsLogin();
      else if (path === '#/ops/dashboard') html = renderOpsDashboard();
      else if (mWs) html = renderWorkspace(mWs[1], mWs[2]);
      else html = renderNotFound();
      root.innerHTML = html;
      window.scrollTo({ top: 0 });
    }

    function submitVaultRoles(e) {
      if (!wallet()) return toast('请先连接钱包');
      // 金库角色表单同时出现在金库详情（#/vaults/manage/:id）与角色工作台（#/workspace/:role/:id）
      const m = currentPath().match(/^#\/(?:vaults\/manage|workspace\/[^/]+)\/([^/]+)$/);
      if (!m) return toast('未找到金库上下文');
      const vault = vaultById(m[1]);
      if (!vault) return toast('金库不存在');
      if (vault.owner !== shortAddress(wallet().address)) return toast('IVaultRoles 仅 Owner 可调（_onlyOwner），当前账户无权');
      const f = e.target;
      const changes = [];
      const applyRole = (key, fnName) => {
        const v = (f[key]?.value || '').trim();
        if (v && v !== (vault[key] || '')) { vault[key] = shortAddress(v); changes.push(`${fnName} → ${shortAddress(v)}`); }
        else if (!v && vault[key]) { delete vault[key]; changes.push(`${fnName} → 未设置`); }
      };
      applyRole('curator', 'setCurator');
      applyRole('guardian', 'setGuardian');
      applyRole('allocator', 'setAllocator');
      applyRole('keeper', 'setKeeper');
      const newOwner = (f.newOwner?.value || '').trim();
      if (newOwner && newOwner !== vault.owner) { vault.owner = shortAddress(newOwner); changes.push(`transferOwnership → ${shortAddress(newOwner)}`); }
      if (!changes.length) return toast('未检测到角色变更');
      state.activities.unshift({ text: `金库 ${vault.symbol} 角色变更：${changes.join('；')}`, at: Date.now() });
      saveState();
      toast(`IVaultRoles：${changes.join('；')}`);
      renderApp();
    }

    // ---------- Settlement Operator 交互（eth_sign 签名 / submitBatch / confirmFinalSettlement） ----------
    function signSettlementInstruction(vaultId) {
      if (!wallet()) return toast('请先连接钱包');
      const me = myAddr();
      const ops = getSettlementOps(vaultId);
      if (!ops.operators.includes(me)) return toast('你不是本金库的 Settlement Operator（需 Owner 通过 setOperator 任命）');
      state.settlementOps[vaultId] = state.settlementOps[vaultId] || { threshold: 1, operators: [], signatures: {}, history: [] };
      const hash = settleInstructionHash(vaultId);
      state.settlementOps[vaultId].signatures[hash] = state.settlementOps[vaultId].signatures[hash] || [];
      if (state.settlementOps[vaultId].signatures[hash].includes(me)) return toast('你已对当前指令签名（eth_sign），无需重复');
      state.settlementOps[vaultId].signatures[hash].push(me);
      state.activities.unshift({ text: `Settlement ${vaultId}：operator ${holderName(me)} 已对指令 ${hash.slice(0, 10)}… 做 eth_sign 签名`, at: Date.now() });
      saveState(); toast(`eth_sign 签名已记录（${state.settlementOps[vaultId].signatures[hash].length}/${state.settlementOps[vaultId].threshold}）`); renderApp();
    }
    function submitSettlementBatch(vaultId) {
      if (!wallet()) return toast('请先连接钱包');
      const ops = getSettlementOps(vaultId);
      const hash = settleInstructionHash(vaultId);
      const sigs = (state.settlementOps[vaultId] && state.settlementOps[vaultId].signatures[hash]) || [];
      if (!ops.threshold || sigs.length < ops.threshold) return toast(`签名不足：需 ${ops.threshold} 个，当前 ${sigs.length} 个，无法提交 submitBatch`);
      const d = settlementDemoData(vaultId);
      state.settlementOps[vaultId].signatures[hash] = [];
      state.settlementOps[vaultId].history.unshift({ hash, cycle: d.cycle, net: d.net, at: Date.now(), signers: sigs.length, threshold: ops.threshold });
      state.activities.unshift({ text: `Settlement ${vaultId}：submitBatch 成功（cycle #${d.cycle}，轧差净额 ${Number(d.net).toLocaleString()}，${sigs.length}/${ops.threshold} 签）`, at: Date.now() });
      saveState(); toast('submitBatch 已上链：结算批次执行成功（签名数达标、状态正确、资金守恒）'); renderApp();
    }
    function confirmFinalSettlement(vaultId) {
      if (!wallet()) return toast('请先连接钱包');
      const ops = getSettlementOps(vaultId);
      if (!ops.operators.includes(myAddr())) return toast('confirmFinalSettlement 需 operator 签名（KeeperBot 无 operator 私钥，不可执行）');
      state.activities.unshift({ text: `Settlement ${vaultId}：confirmFinalSettlement 最终结算已确认`, at: Date.now() });
      saveState(); toast('confirmFinalSettlement：产品最终结算已确认'); renderApp();
    }
    function submitSettleOps(e) {
      if (!wallet()) return toast('请先连接钱包');
      const f = e.target;
      const vaultId = f.vaultId.value;
      const vault = vaultById(vaultId);
      if (!vault) return toast('金库不存在');
      if (vault.owner !== myAddr()) return toast('仅 Vault Owner 可调 setOperator / setThreshold');
      state.settlementOps[vaultId] = state.settlementOps[vaultId] || { threshold: 1, operators: [], signatures: {}, history: [] };
      const ops = state.settlementOps[vaultId];
      const addr = (f.opAddr.value || '').trim();
      if (addr) { const s = shortAddress(addr); if (!ops.operators.includes(s)) { ops.operators.push(s); } }
      const th = Math.max(1, Number(f.threshold.value) || 1);
      ops.threshold = th;
      state.activities.unshift({ text: `Settlement ${vaultId}：${addr ? `setOperator(${shortAddress(addr)}, true)` : '更新 operator'}；setThreshold(${th})`, at: Date.now() });
      saveState(); toast(`operator 配置已保存：${ops.operators.length} 名 operator，阈值 ${th}`); renderApp();
    }

    function submitReq(e, type) {
      if (!wallet()) return toast('请先连接钱包');
      const f = e.target;
      const m = currentPath().match(/^#\/assets\/mintburn\/(\d+)$/);
      if (!m) return toast('未找到资产上下文');
      const assetId = Number(m[1]);
      if (!holdsAssetRole('asset-owner', assetId)) return toast('需要该资产的 Issuer（Asset Owner，ownerOf 匹配）才能发起');
      const list = type === 'mint' ? state.mintReqs : state.burnReqs;
      const nonce = list.length + 1;
      const target = type === 'mint' ? f.to.value.trim() : f.from.value.trim(); // mint 用 to；burn 用 from（initiateBurn 的 from 参数）
      list.push({ nonce, assetId, amount: f.amount.value, to: target, status: 'pending', initiator: wallet().address, at: Date.now() });
      state.activities.unshift({ text: `${type === 'mint' ? 'Mint' : 'Burn'} 申请 #${nonce} 已发起（${assetById(assetId)?.symbol}）`, at: Date.now() });
      saveState();
      toast(`${type === 'mint' ? 'MintInitiated' : 'BurnInitiated'} #${nonce}：请切换到 Token Agent（Bob）账户批准`);
      renderApp();
    }

    function approveRequest(type, nonce) {
      if (!wallet()) return toast('请先连接钱包');
      const list = type === 'mint' ? state.mintReqs : state.burnReqs;
      const req = list.find(r => r.nonce === nonce);
      if (!req) return toast('请求不存在');
      if (!holdsAssetRole('token-agent', req.assetId)) return toast('需要该资产的 Token Agent（setTokenAgent 任命的地址）才能批准');
      if (req.status !== 'pending') return toast('该请求已处理');
      req.status = 'approved'; req.approver = wallet().address;
      state.activities.unshift({ text: `${type === 'mint' ? 'Mint' : 'Burn'} #${nonce} 已双签批准并执行`, at: Date.now() });
      saveState();
      toast(`${type === 'mint' ? 'MintApproved' : 'BurnApproved'} #${nonce}：代币已${type === 'mint' ? '铸造' : '销毁'}`);
      renderApp();
    }

    function submitNav(e) {
      if (!wallet()) return toast('请先连接钱包');
      if (!hasRole('nav-signer')) return toast('需要 nav-signer（NAVOracle owner 任命的签名者），当前账户不可提交');
      const f = e.target;
      const assetId = Number(f.rwaToken.value);
      const asset = assetById(assetId);
      if (!asset) return toast('资产不存在');
      const price = Number(f.nav.value);
      if (!(price > 0)) return toast('合约要求 price > 0（InvalidNAV）');
      const ts = Number(f.dataTimestamp.value);
      const now = Math.floor(Date.now() / 1000);
      if (!(ts > 0)) return toast('dataTimestamp 必须为正数');
      if (ts > now) return toast('合约拒绝未来时间戳（FutureData）：dataTimestamp 不能大于当前时间');
      const prev = state.navRecords[assetId];
      if (prev && Number(prev.dataTimestamp) >= ts) return toast('合约要求时间戳单调递增（NonMonotonicTimestamp）');
      if (prev && price > Number(prev.nav) && price > Number(prev.nav) * 1.2 + 1e-12) return toast('较上次 NAV 上涨超过 20% 会被合约拒绝（DeviationTooHigh）');
      state.navRecords[assetId] = { nav: f.nav.value, dataTimestamp: ts, signer: wallet().address, at: Date.now() };
      state.activities.unshift({ text: `NAV 更新：${asset?.symbol || assetId} = ${f.nav.value}（rwaToken ${asset?.token || ''}）`, at: Date.now() });
      saveState();
      toast('NAVUpdated：签名校验通过，NAV 已落账');
      renderApp();
    }

    function submitPor(e) {
      if (!wallet()) return toast('请先连接钱包');
      const assetId = Number(e.target.assetId.value);
      // 逐对象权限：必须是所选资产的 Owner 或该资产任命的 Proof Publisher
      if (!(holdsAssetRole('proof-publisher', assetId) || holdsAssetRole('asset-owner', assetId))) return toast('所选资产需要 Owner 或任命的 Proof Publisher（Carol），请切换资产或账户');
      const f = e.target;
      const docHash = f.documentHash.value.trim();
      if (!/^0x[0-9a-fA-F]{64}$/.test(docHash)) return toast('documentHash 必须是 0x + 64 位十六进制（keccak256 输出），请选择文档自动生成或手动填写');
      state.proofs.push({ assetId, documentHash: docHash, uri: f.uri.value.trim(), publisher: wallet().address, at: Date.now() });
      state.activities.unshift({ text: `储备证明已发布（asset #${assetId}）`, at: Date.now() });
      saveState();
      toast('ReserveProofPublished：证明已追加记录');
      renderApp();
    }

    function submitWrap(e) {
      if (!wallet()) return toast('请先连接钱包');
      const f = e.target;
      const w = wrappedById(Number(f.wrappedId.value));
      const direction = f.direction.value;
      const amount = f.amount.value;
      const to = (f.to.value || '').trim();
      if (!w) return toast('包装资产不存在');
      if (!to) return toast('接收地址 to 不能为空（ZeroAddress 拒绝）');
      if (w.mode === 0) {
        state.activities.unshift({ text: `${direction === 'wrap' ? 'Wrap' : 'Unwrap'} ${amount} → ${w.symbol}（Token Custody 1:1，to ${shortAddress(to)}）`, at: Date.now() });
        toast(`演示成功：${direction === 'wrap' ? 'wrap' : 'unwrap'} ${amount} 已完成（${w.modeLabel}）`);
      } else if (direction === 'unwrap') {
        state.activities.unshift({ text: `Unwrap 全额 ${w.symbol} → ReleaseRequested（链外释放，to ${shortAddress(to)}）`, at: Date.now() });
        toast('演示成功：Proof 模式全额赎回已触发 ReleaseRequested，链外执行释放');
      } else if (direction === 'wrap' && w.signer && w.signer === shortAddress(wallet().address)) {
        const nonce = f.nonce.value, expiry = f.expiry.value, documentId = (f.documentId.value || '').trim();
        state.activities.unshift({ text: `mintWithAuthorization ${amount} ${w.symbol}（Document Proof：nonce ${nonce} / expiry ${expiry} / doc ${documentId || '—'}，to ${shortAddress(to)}）`, at: Date.now() });
        toast('演示成功：该包装资产任命的 PSM Authorized Signer 已签名，铸币完成');
      } else {
        return toast('Document Proof 模式需要该包装资产任命的 PSM Authorized Signer 签名（wrapperController 通过 setAuthorizedSigner 任命，演示为 Bob）');
      }
      saveState(); renderApp();
    }

    function submitWrapped(e) {
      if (!wallet()) return toast('请先连接钱包');
      const f = e.target;
      const mode = Number(f.mode.value);
      const assetId = Number(f.assetId.value);
      const decimals = Number(f.decimals.value || 18);
      const allowPartial = mode === 1 ? false : f.allowPartialUnwrap.value === 'true';
      const underlyingToken = mode === 1 ? '0x0000...0000' : (f.underlyingToken.value || '').trim() || '0x0000...0000';
      const id = WRAPPED.length + 3;
      WRAPPED.push({ assetId, name: f.name.value.trim(), symbol: f.symbol.value.trim().toUpperCase(), mode, modeLabel: mode === 0 ? 'Token Custody' : 'Document Proof', underlying: mode === 1 ? '无链上托管' : '自定义底层', underlyingToken, wrappedToken: '0x9D22...e' + id, decimals, allowPartial, paused: false, controller: shortAddress(wallet().address) });
      state.activities.unshift({ text: `部署包装资产 ${WRAPPED[WRAPPED.length - 1].symbol}（deployWrappedToken：asset #${assetId}，mode ${mode}，decimals ${decimals}，allowPartial ${allowPartial}）`, at: Date.now() });
      saveState(); toast(`deployWrappedToken：包装资产已部署，你已成为该资产的 Wrapper Controller`); renderApp();
    }

      state.activities.unshift({ text: `创建金库 ${f.name.value.trim()}（deployVault：adapterRegistry ${f.adapterRegistry.value.trim()} / product ${f.initialProduct.value} / cycle ${f.initialCycle.value}）`, at: Date.now() });

    function togglePause(assetId) {
      if (!wallet()) return toast('请先连接钱包');
      const w = WRAPPED.find(x => x.assetId === assetId);
      if (!w) return toast('包装资产不存在');
      const isController = (w.controller && w.controller === shortAddress(wallet().address)) || hasRole('governor');
      if (!isController) return toast('需要 Wrapper Controller（部署者）或 Governor（全局 pause）');
      w.paused = !w.paused;
      state.activities.unshift({ text: `${w.paused ? '暂停' : '恢复'}包装资产 ${w.symbol}（pauseAsset，Controller ${shortAddress(wallet().address)}）`, at: Date.now() });
      saveState(); toast(w.paused ? `pauseAsset：${w.symbol} 已暂停兑换` : `${w.symbol} 已恢复`); renderApp();
    }

    // ---------- 事件绑定（事件委托） ----------
    document.addEventListener('click', e => {
      const menuTrigger = e.target.closest('.navmenu__trigger');
      if (menuTrigger) { const menu = menuTrigger.closest('.navmenu'); menu.classList.toggle('open'); menu.querySelectorAll('.navmenu__trigger')[0].setAttribute('aria-expanded', menu.classList.contains('open')); return; }
      const menuItem = e.target.closest('.navmenu__item');
      if (menuItem) { const menu = menuItem.closest('.navmenu'); menu.classList.remove('open'); menu.querySelectorAll('.navmenu__trigger')[0].setAttribute('aria-expanded', 'false'); }
      const menuFoot = e.target.closest('.navmenu__foot button');
      if (menuFoot) { const menu = menuFoot.closest('.navmenu'); menu.classList.remove('open'); menu.querySelectorAll('.navmenu__trigger')[0].setAttribute('aria-expanded', 'false'); }
      const routeEl = e.target.closest('[data-route]');
      if (routeEl) { navigate(routeEl.dataset.route); return; }
      const issuanceTab = e.target.closest('[data-issuance-tab]');
      if (issuanceTab) { state.activeIssuanceTab = issuanceTab.dataset.issuanceTab; saveState(); navigate('#/issuance/issue'); return; }
      const open = e.target.closest('[data-open-wallet]');
      if (open) { openWalletModal(); return; }
      const close = e.target.closest('[data-close-modal]');
      if (close && close === e.target) { closeModal(); return; }
      const toastBtn = e.target.closest('[data-toast]');
      if (toastBtn) { toast(toastBtn.dataset.toast); return; }
      const connect = e.target.closest('[data-connect-wallet]');
      if (connect) { state.walletSession.connected = true; state.walletSession.walletId = connect.dataset.connectWallet; saveState(); closeModal(); toast(`已连接 ${WALLETS[connect.dataset.connectWallet].name}`); renderApp(); return; }
      const reset = e.target.closest('[data-reset]');
      if (reset) { resetState(); return; }
      const approve = e.target.closest('[data-approve]');
      if (approve) { const [type, nonce] = approve.dataset.approve.split(':'); approveRequest(type, Number(nonce)); return; }
      const pause = e.target.closest('[data-toggle-pause]');
      if (pause) { togglePause(Number(pause.dataset.togglePause)); return; }
      const scrollTo = e.target.closest('[data-scroll]');
      if (scrollTo) { const el = document.getElementById(scrollTo.dataset.scroll); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' }); return; }
      const hashBtn = e.target.closest('[data-reg-file-btn], [data-por-file-btn]');
      if (hashBtn) { const isReg = hashBtn.hasAttribute('data-reg-file-btn'); hashFileTo(isReg ? 'reg-file' : 'por-file', isReg ? 'reg-hash' : 'por-hash', isReg ? 'metadataHash' : 'documentHash'); return; }
      const listing = e.target.closest('[data-submit-listing]');
      if (listing) { submitListing(listing.dataset.submitListing); return; }
      const settleSign = e.target.closest('[data-settle-sign]');
      if (settleSign) { signSettlementInstruction(settleSign.dataset.settleSign); return; }
      const settleSubmit = e.target.closest('[data-settle-submit]');
      if (settleSubmit) { submitSettlementBatch(settleSubmit.dataset.settleSubmit); return; }
      const settleFinal = e.target.closest('[data-settle-final]');
      if (settleFinal) { confirmFinalSettlement(settleFinal.dataset.settleFinal); return; }
      const opsApprove = e.target.closest('[data-ops-approve]');
      if (opsApprove) { opsReview(opsApprove.dataset.opsApprove, 'approve'); return; }
      const opsReject = e.target.closest('[data-ops-reject]');
      if (opsReject) { opsReview(opsReject.dataset.opsReject, 'reject'); return; }
      const logout = e.target.closest('[data-ops-logout]');
      if (logout) { state.opsSession = { authenticated: false, reviewer: '' }; saveState(); navigate('#/ops/login'); toast('已退出审核后台'); return; }
    });

    document.addEventListener('mousedown', e => {
      const inside = e.target.closest('.navmenu');
      if (!inside) document.querySelectorAll('.navmenu.open').forEach(m => { m.classList.remove('open'); m.querySelector('.navmenu__trigger').setAttribute('aria-expanded', 'false'); });
    });

    document.addEventListener('change', e => {
      if (e.target.matches('[data-network-select]')) { state.walletSession.network = e.target.value; saveState(); renderApp(); return; }
      if (e.target.matches('[data-connect-network]')) { state.walletSession.network = e.target.value; saveState(); renderApp(); return; }
      if (e.target.matches('[data-modal-network]')) { state.walletSession.network = e.target.value; saveState(); openWalletModal(); return; }
      if (e.target.matches('[data-wrap-asset]')) {
        const note = document.getElementById('wrap-proof-note');
        if (note) { const w = wrappedById(Number(e.target.value)); note.style.display = w && w.mode === 1 ? 'block' : 'none'; }
        const status = document.getElementById('wrap-signer-status');
        if (status) { const w = wrappedById(Number(e.target.value)); status.innerHTML = w ? psmSignerStatus(w) : ''; }
      }
      if (e.target.matches('[data-por-asset]')) { state.activePorAsset = Number(e.target.value); saveState(); renderApp(); return; }
      if (e.target.matches('[data-wrapped-mode]')) {
        const field = document.getElementById('wrapped-underlying-field');
        if (field) {
          const proof = e.target.value === '1';
          field.style.display = proof ? 'none' : 'block';
          const input = field.querySelector('input[name="underlyingToken"]');
          if (input) input.value = proof ? '0x0000000000000000000000000000000000000000' : '';
        }
      }
      if (e.target.matches('[data-reg-file], [data-por-file]')) { hashFileTo(e.target.id, e.target.id === 'reg-file' ? 'reg-hash' : 'por-hash', e.target.id === 'reg-file' ? 'metadataHash' : 'documentHash'); return; }
    });

    document.addEventListener('submit', e => {
      const map = { 'reg-form': submitRegister, 'mint-form': ev => submitReq(ev, 'mint'), 'burn-form': ev => submitReq(ev, 'burn'), 'nav-form': submitNav, 'por-form': submitPor, 'wrap-form': submitWrap, 'wrapped-form': submitWrapped, 'create-vault-form': submitCreateVault, 'vault-roles-form': submitVaultRoles, 'asset-appoint-form': submitAssetAppointments, 'vault-appoint-form': submitVaultAppointments, 'settle-ops-form': submitSettleOps, 'ops-login-form': submitOpsLogin };
      const fn = map[e.target.id];
      if (fn) { e.preventDefault(); fn(e); }
    });

    function submitOpsLogin(e) {
      const f = e.target;
      if (f.email.value.trim() === 'reviewer@hypertessera.demo' && f.password.value === 'Demo2026!') {
        state.opsSession = { authenticated: true, reviewer: f.email.value.trim() };
        saveState(); toast('登录成功，进入审核 Dashboard'); navigate('#/ops/dashboard');
      } else {
        toast('账号或密码错误（演示：reviewer@hypertessera.demo / Demo2026!）');
      }
    }

    function init() {
      if (!location.hash) location.hash = '#/';
      window.addEventListener('hashchange', renderApp);
      renderApp();
    }
    init();
  </script>
</body>
</html>
