<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="HyperTessera PR#12 资产基础设施工作台 · 页面结构与操作流程设计稿">
  <title>HyperTessera · PR#12 工作台结构设计稿</title>
  <style>
    :root {
      --ink: #13243a; --muted: #607086; --quiet: #8a97a8;
      --line: #dce3eb; --line-strong: #c8d2df;
      --canvas: #f3f6f9; --surface: #ffffff; --surface-soft: #f8fafc;
      --navy: #173f72; --navy-strong: #0c2c52; --navy-soft: #e9f1fb;
      --success: #19725b; --success-soft: #e7f5f0;
      --warning: #98601b; --warning-soft: #fff3dc;
      --danger: #aa3f4c; --danger-soft: #fcebed;
      --shadow: 0 12px 32px rgba(23,51,80,.08);
      --radius: 14px; --radius-sm: 9px; --header-h: 70px;
      font-family: "Segoe UI", "Microsoft YaHei UI", "PingFang SC", sans-serif;
      color: var(--ink); background: var(--canvas);
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body { margin: 0; min-width: 320px; background: var(--canvas); }
    button, input, select, textarea { font: inherit; }
    button, a { -webkit-tap-highlight-color: transparent; }
    button { cursor: pointer; }
    a { color: inherit; text-decoration: none; }
    h1, h2, h3, h4, p { margin-top: 0; }
    h1 { font-size: clamp(30px, 4vw, 48px); line-height: 1.1; letter-spacing: -.035em; }
    h2 { font-size: clamp(24px, 3vw, 32px); letter-spacing: -.025em; }
    h3 { font-size: 18px; }
    p { line-height: 1.65; color: var(--muted); }

    .topbar { position: sticky; top: 0; z-index: 40; height: var(--header-h); display: flex; align-items: center; gap: 20px; padding: 0 max(24px, calc((100vw - 1360px) / 2)); background: rgba(255,255,255,.96); border-bottom: 1px solid var(--line); backdrop-filter: blur(14px); }
    .brand { font-size: 20px; font-weight: 760; letter-spacing: -.03em; white-space: nowrap; }
    .brand span { color: var(--navy); }
    .topnav { display: flex; align-items: center; gap: 4px; flex: 1; }
    .navlink, .text-button { border: 0; background: transparent; color: var(--muted); border-radius: 8px; padding: 10px 12px; font-weight: 600; white-space: nowrap; }
    .navlink:hover, .navlink.active, .text-button:hover { color: var(--navy); background: var(--navy-soft); }
    .top-actions { display: flex; align-items: center; gap: 8px; }
    .network-select { height: 40px; border: 1px solid var(--line-strong); border-radius: 9px; background: var(--surface); color: var(--ink); padding: 0 30px 0 11px; max-width: 160px; }

    .btn { min-height: 40px; border-radius: 9px; border: 1px solid var(--navy); padding: 9px 15px; background: var(--navy); color: white; font-weight: 700; transition: transform .16s ease, box-shadow .16s ease; }
    .btn:hover { transform: translateY(-1px); box-shadow: 0 8px 18px rgba(23,63,114,.18); }
    .btn.secondary { background: var(--surface); color: var(--navy); border-color: var(--line-strong); }
    .btn.secondary:hover { border-color: var(--navy); box-shadow: none; }
    .btn.ghost { border-color: transparent; background: transparent; color: var(--muted); }
    .btn.success { background: var(--success); border-color: var(--success); }
    .btn.warning { background: var(--warning); border-color: var(--warning); }
    .btn.danger { background: var(--danger); border-color: var(--danger); }
    .btn.small { min-height: 34px; padding: 6px 11px; font-size: 13px; }
    .btn:disabled { cursor: not-allowed; opacity: .45; transform: none; box-shadow: none; }
    .wallet-button { max-width: 180px; overflow: hidden; text-overflow: ellipsis; }

    .page { max-width: 1360px; margin: 0 auto; padding: 34px 24px 72px; }
    .page-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 24px; margin-bottom: 26px; }
    .page-head h1, .page-head h2 { margin-bottom: 8px; }
    .page-head p { max-width: 760px; margin-bottom: 0; }
    .eyebrow { color: var(--navy); font-size: 12px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; margin-bottom: 12px; }
    .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); }
    .card-pad { padding: 24px; }
    .soft { background: var(--surface-soft); box-shadow: none; }
    .grid { display: grid; gap: 16px; }
    .grid.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .grid.three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .grid.four { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    .stack { display: grid; gap: 16px; }
    .row { display: flex; align-items: center; gap: 12px; }
    .row.between { justify-content: space-between; }
    .wrap { flex-wrap: wrap; }
    .muted { color: var(--muted); }
    .quiet { color: var(--quiet); }
    .small { font-size: 13px; }
    .mono { font-family: Consolas, "SFMono-Regular", monospace; letter-spacing: -.02em; }
    .divider { height: 1px; background: var(--line); margin: 20px 0; }

    .badge { display: inline-flex; align-items: center; min-height: 26px; padding: 4px 9px; border-radius: 999px; background: var(--navy-soft); color: var(--navy); font-size: 12px; font-weight: 750; }
    .badge.success { color: var(--success); background: var(--success-soft); }
    .badge.warning { color: var(--warning); background: var(--warning-soft); }
    .badge.danger { color: var(--danger); background: var(--danger-soft); }
    .badge.neutral { color: var(--muted); background: #edf1f5; }

    .hero { min-height: 500px; display: grid; grid-template-columns: 1.12fr .88fr; gap: 44px; align-items: center; padding: 54px; background: var(--navy-strong); color: white; overflow: hidden; }
    .hero h1 { max-width: 760px; margin-bottom: 20px; }
    .hero p { color: #c8d7e8; font-size: 17px; max-width: 640px; }
    .hero .eyebrow { color: #9dc1e9; }
    .hero-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 28px; }
    .hero .btn { background: white; border-color: white; color: var(--navy-strong); }
    .hero .btn.secondary { color: white; background: transparent; border-color: #6686aa; }
    .journey { padding: 24px; background: #12345e; border: 1px solid #355a83; border-radius: var(--radius); }
    .journey-step { display: grid; grid-template-columns: 32px 1fr; gap: 12px; padding: 14px 0; border-bottom: 1px solid #355a83; }
    .journey-step:last-child { border-bottom: 0; }
    .step-no { width: 28px; height: 28px; display: grid; place-items: center; border: 1px solid #6f91b8; border-radius: 50%; color: white; font-weight: 800; font-size: 12px; }
    .journey-step strong { display: block; margin-bottom: 3px; }
    .journey-step span { color: #aebfd3; font-size: 13px; line-height: 1.45; }

    .section { margin-top: 28px; }
    .section-title { display: flex; justify-content: space-between; gap: 16px; align-items: end; margin-bottom: 14px; }
    .section-title h2, .section-title h3 { margin-bottom: 0; }
    .entry-card { padding: 24px; min-height: 190px; display: flex; flex-direction: column; }
    .entry-card p { flex: 1; }
    .entry-kicker { color: var(--navy); font-weight: 800; font-size: 13px; margin-bottom: 24px; }

    .stat { padding: 20px; }
    .stat-label { color: var(--muted); font-size: 13px; font-weight: 650; margin-bottom: 10px; }
    .stat-value { font-size: 28px; font-weight: 780; letter-spacing: -.035em; }
    .stat-foot { margin-top: 8px; color: var(--quiet); font-size: 12px; }

    .filterbar { display: flex; flex-wrap: wrap; gap: 10px; padding: 14px; margin-bottom: 16px; }
    .field { display: grid; gap: 7px; }
    .field label { font-size: 13px; color: var(--muted); font-weight: 700; }
    .input, .select, .textarea { width: 100%; min-height: 42px; border: 1px solid var(--line-strong); border-radius: 9px; background: white; padding: 9px 11px; color: var(--ink); outline: none; }
    .textarea { min-height: 90px; resize: vertical; }
    .input:focus, .select:focus, .textarea:focus { border-color: var(--navy); box-shadow: 0 0 0 3px var(--navy-soft); }
    .form-grid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 16px; }
    .field.full { grid-column: 1 / -1; }
    .error-text { color: var(--danger); font-size: 13px; margin-top: 8px; }

    .account-list { padding: 14px; display: grid; gap: 8px; }
    .account-option { width: 100%; text-align: left; border: 1px solid var(--line); border-radius: 11px; background: white; padding: 15px; display: flex; justify-content: space-between; gap: 12px; }
    .account-option:hover { border-color: var(--navy); background: var(--navy-soft); }
    .account-option strong, .account-option span { display: block; }
    .account-option span { margin-top: 5px; color: var(--muted); font-size: 12px; }
    .connect-panel { display: grid; grid-template-columns: 1fr 1.2fr; gap: 24px; align-items: stretch; }
    .connect-copy { padding: 32px; background: var(--navy-strong); color: white; }
    .connect-copy p { color: #c8d7e8; }

    .contextbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 12px 15px; margin-bottom: 16px; box-shadow: none; }
    .context-item { padding-right: 12px; margin-right: 4px; border-right: 1px solid var(--line); }
    .context-item:last-child { border-right: 0; }
    .context-item span { display: block; color: var(--quiet); font-size: 10px; text-transform: uppercase; letter-spacing: .08em; }
    .context-item strong { font-size: 13px; }

    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; min-width: 720px; }
    th, td { padding: 13px 14px; text-align: left; border-bottom: 1px solid var(--line); font-size: 13px; vertical-align: middle; }
    th { color: var(--quiet); font-size: 11px; text-transform: uppercase; letter-spacing: .06em; background: var(--surface-soft); }
    tr:last-child td { border-bottom: 0; }
    .table-link { border: 0; background: transparent; color: var(--navy); font-weight: 750; padding: 0; }

    .empty { padding: 48px 24px; text-align: center; }
    .empty h3 { margin-bottom: 8px; }
    .empty p { max-width: 520px; margin: 0 auto 20px; }

    .toast { position: fixed; right: 22px; bottom: 22px; z-index: 90; width: min(400px, calc(100vw - 44px)); background: var(--navy-strong); color: white; border-radius: 11px; padding: 14px 16px; box-shadow: 0 18px 50px rgba(10,28,49,.28); opacity: 0; transform: translateY(12px); pointer-events: none; transition: .2s ease; }
    .toast.show { opacity: 1; transform: translateY(0); }
    .modal-backdrop { position: fixed; inset: 0; z-index: 80; background: rgba(9,25,43,.56); display: grid; place-items: center; padding: 18px; }
    .modal { width: min(560px, 100%); max-height: calc(100vh - 36px); overflow: auto; padding: 24px; }
    .modal-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 18px; margin-bottom: 20px; }
    .modal-head h2, .modal-head h3 { margin-bottom: 6px; }
    .close-button { border: 0; background: var(--surface-soft); color: var(--muted); border-radius: 8px; width: 36px; height: 36px; font-size: 20px; }

    /* ---- PR#12 设计稿新增组件 ---- */
    /* 合约调用标签：每个操作按钮旁标注对应的链上函数 */
    .call-tag { display: inline-block; font-family: Consolas, "SFMono-Regular", monospace; font-size: 11px; color: var(--navy); background: var(--navy-soft); border: 1px solid #d2e2f7; border-radius: 6px; padding: 2px 7px; letter-spacing: -.01em; }
    .call-tag.plain { color: var(--success); background: var(--success-soft); border-color: #cde9e0; }
    /* 右侧操作说明面板 */
    .work-layout { display: grid; grid-template-columns: minmax(0,1fr) 320px; gap: 18px; align-items: start; }
    .side-panel { position: sticky; top: calc(var(--header-h) + 18px); padding: 20px; }
    .side-panel h4 { margin: 0 0 12px; font-size: 14px; }
    .side-panel .kv { display: flex; justify-content: space-between; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
    .side-panel .kv:last-child { border-bottom: 0; }
    .side-panel .kv span { color: var(--quiet); white-space: nowrap; }
    .side-panel .kv strong { text-align: right; font-size: 12.5px; }
    .side-panel .op-desc { font-size: 12.5px; color: var(--muted); line-height: 1.6; margin-bottom: 14px; }
    .side-panel .op-alert { padding: 10px 12px; border-radius: 8px; background: var(--warning-soft); color: var(--warning); font-size: 12px; line-height: 1.5; margin-top: 12px; }
    /* 流程步骤条 */
    .flowbar { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 10px; }
    .flowstep { padding: 14px; border-radius: 11px; background: var(--surface-soft); border: 1px solid var(--line); }
    .flowstep .step-no { width: 24px; height: 24px; border-color: var(--line-strong); color: var(--quiet); margin-bottom: 10px; }
    .flowstep strong { display: block; font-size: 13px; margin-bottom: 4px; color: var(--muted); }
    .flowstep span { font-size: 11.5px; color: var(--quiet); line-height: 1.5; display: block; }
    .flowstep.done { background: var(--success-soft); border-color: #cde9e0; }
    .flowstep.done .step-no { border-color: var(--success); color: var(--success); }
    .flowstep.done strong { color: var(--success); }
    .flowstep.current { background: var(--navy-soft); border-color: #c4d9f5; }
    .flowstep.current .step-no { border-color: var(--navy); color: var(--navy); }
    .flowstep.current strong { color: var(--navy); }
    /* 双签请求列表 */
    .req-list { display: grid; gap: 10px; }
    .req-item { padding: 16px; border: 1px solid var(--line); border-radius: 11px; background: var(--surface); display: flex; justify-content: space-between; gap: 14px; align-items: center; }
    .req-item .req-main h4 { margin: 0 0 4px; font-size: 14px; }
    .req-item .req-main p { margin: 0; font-size: 12.5px; }
    .req-state { display: inline-flex; align-items: center; min-height: 24px; padding: 3px 9px; border-radius: 999px; font-size: 12px; font-weight: 750; }
    .req-state.pending { color: var(--warning); background: var(--warning-soft); }
    .req-state.approved { color: var(--success); background: var(--success-soft); }
    /* 蓝图页 */
    .sitemap-grid { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 16px; }
    .sitemap-card { padding: 18px; display: flex; flex-direction: column; gap: 8px; }
    .sitemap-card .route { font-family: Consolas, "SFMono-Regular", monospace; font-size: 11px; color: var(--quiet); }
    .sitemap-card h4 { margin: 0; font-size: 15px; }
    .sitemap-card p { margin: 0; font-size: 12.5px; flex: 1; }
    .edge-list { display: grid; gap: 8px; }
    .edge-row { display: grid; grid-template-columns: minmax(0,1fr) auto minmax(0,1fr); gap: 8px; align-items: center; padding: 10px 12px; border: 1px solid var(--line); border-radius: 9px; background: var(--surface); font-size: 12.5px; }
    .edge-row .edge-from, .edge-row .edge-to { font-weight: 700; color: var(--navy); }
    .edge-row .edge-via { color: var(--quiet); font-size: 11.5px; text-align: center; }
    .edge-row .edge-cond { grid-column: 1 / -1; color: var(--muted); font-size: 11.5px; padding-top: 2px; }
    .role-chip { display: inline-block; padding: 2px 8px; border-radius: 6px; background: var(--navy-soft); color: var(--navy); font-size: 11px; font-weight: 750; }
    .role-chip.open { background: var(--success-soft); color: var(--success); }

    /* ---- 顶部 hover 下拉导航（资产发行 / 资产管理 大模块） ---- */
    .navmenu { position: relative; }
    .navmenu__trigger { display: inline-flex; align-items: center; gap: 6px; }
    .navmenu__chev { transition: transform .16s ease; opacity: .75; }
    .navmenu:hover .navmenu__chev, .navmenu.open .navmenu__chev { transform: rotate(180deg); }
    .navmenu__panel { position: absolute; top: calc(100% + 12px); left: 50%; transform: translateX(-50%) translateY(8px); min-width: 520px; padding: 10px 10px 8px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 20px 48px rgba(23,51,80,.16); opacity: 0; visibility: hidden; transition: opacity .16s ease, transform .16s ease, visibility .16s; z-index: 60; }
    .navmenu:hover .navmenu__panel, .navmenu:focus-within .navmenu__panel, .navmenu.open .navmenu__panel { opacity: 1; visibility: visible; transform: translateX(-50%) translateY(0); }
    .navmenu__grid { display: grid; grid-template-columns: 1fr 1fr; gap: 2px 14px; }
        .navmenu__grid--single { grid-template-columns: 1fr; min-width: 340px; }
    .navmenu__group-label { padding: 9px 12px 5px; font-size: 11px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--quiet); }
    .navmenu__item { display: block; width: 100%; text-align: left; border: 0; border-radius: 9px; background: transparent; padding: 9px 12px; }
    .navmenu__item:hover { background: var(--navy-soft); }
    .navmenu__item.active { background: var(--navy-soft); }
    .navmenu__item strong { display: block; font-size: 13.5px; color: var(--ink); }
    .navmenu__item span { display: block; font-size: 12px; color: var(--muted); margin-top: 2px; line-height: 1.45; }
    .navmenu__item .call-tag { margin-top: 5px; }
    .navmenu__foot { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 9px 12px 2px; margin-top: 6px; border-top: 1px solid var(--line); }
    .navmenu__foot button { border: 0; background: transparent; color: var(--navy); font-weight: 750; font-size: 12.5px; padding: 4px 0; }
    .navmenu__foot button:hover { text-decoration: underline; }

    /* ---- 子页面分组切换（发行 | 管理） ---- */
    .subnav { display: inline-flex; gap: 4px; padding: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 11px; margin-bottom: 22px; box-shadow: var(--shadow); }
    .subnav button { border: 0; border-radius: 8px; padding: 8px 18px; background: transparent; color: var(--muted); font-weight: 700; font-size: 13px; }
    .subnav button:hover { color: var(--navy); }
    .subnav button.active { background: var(--navy); color: white; }

    /* ---- 模块选择卡片（发行 / 管理中心） ---- */
    .module-card { position: relative; padding: 24px; display: flex; flex-direction: column; gap: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); transition: transform .16s ease, box-shadow .16s ease, border-color .16s ease; }
    .module-card:hover { transform: translateY(-2px); border-color: var(--navy); box-shadow: 0 18px 40px rgba(23,51,80,.12); }
    .module-card .module-no { width: 32px; height: 32px; border-radius: 9px; display: grid; place-items: center; background: var(--navy); color: white; font-weight: 800; font-size: 12.5px; margin-bottom: 14px; letter-spacing: .03em; }
    .module-card .module-no.soft { background: var(--navy-soft); color: var(--navy); }
    .module-card h3 { margin: 0 0 4px; font-size: 17px; }
    .module-card p { margin: 0 0 18px; font-size: 13px; flex: 1; }
    .module-card .module-route { position: absolute; top: 24px; right: 24px; }
    .module-card .module-actions { display: flex; align-items: center; justify-content: space-between; gap: 10px; }

    /* ---- 角色工作台双栏布局（业务页面 / 我的角色 + 操作区） ---- */
    .workspace-shell { display: grid; grid-template-columns: 276px minmax(0,1fr); gap: 18px; align-items: start; }
    .sidebar { position: sticky; top: calc(var(--header-h) + 16px); padding: 14px; max-height: calc(100vh - var(--header-h) - 32px); overflow: auto; }
    .side-section { margin-bottom: 18px; }
    .side-section:last-child { margin-bottom: 0; }
    .side-label { padding: 6px 9px; font-size: 11px; font-weight: 800; color: var(--quiet); text-transform: uppercase; letter-spacing: .09em; }
    .side-link { width: 100%; display: block; text-align: left; border: 0; background: transparent; color: var(--muted); padding: 10px 9px; border-radius: 8px; font-weight: 650; margin: 2px 0; transition: background .14s ease, color .14s ease; }
    .side-link:hover, .side-link.active { background: var(--navy-soft); color: var(--navy); }
    .side-link small { display: block; margin-top: 4px; font-weight: 500; color: var(--quiet); }
    .side-link.active small { color: var(--navy); }
    .workspace-main { min-width: 0; }
    .capability { padding: 18px 20px; border-left: 4px solid var(--navy); box-shadow: none; }
    .action-list { display: grid; gap: 2px; }
    .action-row { display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 16px; align-items: center; padding: 16px 14px; border-bottom: 1px solid var(--line); border-radius: 10px; transition: background .14s ease; }
    .action-row:last-child { border-bottom: 0; }
    .action-row:hover { background: var(--surface-soft); }
    .action-row h4 { margin: 0 0 5px; }
    .action-row p { margin: 0; font-size: 13px; }
    /* stat 卡小图标（更友好的视觉层级） */
    .stat .stat-label { display: flex; align-items: center; gap: 6px; }
    .stat .stat-label .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--navy); opacity: .55; flex: none; }
    .stat .stat-label .dot.success { background: var(--success); }
    .stat .stat-label .dot.warning { background: var(--warning); }
    /* 表格行 hover 与状态微交互 */
    tbody tr { transition: background .14s ease; }
    tbody tr:hover { background: var(--surface-soft); }
    .table-link { transition: color .14s ease; }
    .table-link:hover { text-decoration: underline; }
    /* ---- 标签页切换（发行 / 包装/解包装 / 工作台） ---- */
    .tab-nav { display: flex; gap: 4px; padding: 4px; background: var(--surface-soft); border: 1px solid var(--line); border-radius: 11px; margin-bottom: 20px; box-shadow: var(--shadow); }
    .tab-btn { flex: 1; border: 0; background: transparent; color: var(--muted); padding: 10px 16px; border-radius: 9px; font-weight: 650; font-size: 14px; transition: .15s; cursor: pointer; text-align: center; }
    .tab-btn.active { background: white; color: var(--navy); box-shadow: 0 2px 8px rgba(0,0,0,.06); }

    // ---------- 演示账户（多账户：一个全能账户 + 多个多元角色账户；实际角色由逐对象任命决定） ----------
    const WALLETS = {

        }

      bob: {
        name: 'Bob · 结算专员', address: '0xB0b50F2421cDC9E99146D76A38A3AAfF0410B050',
        rolesByNetwork: { 'bnb-testnet': ['settlement-operator', 'psm-authorized-signer', 'relayer'], ethereum: [], bnb: [] }
      },

      },
      dan: {
        name: 'Dan · 风控与分配', address: '0xDA7e000000000000000000000000000000000002',
        rolesByNetwork: { 'bnb-testnet': ['guardian', 'allocator'], ethereum: [], bnb: [] }
      },

      },

      },

    ];

    // ---------- 运行状态 ----------
    const DEFAULT_STATE = {
      walletSession: { connected: false, network: 'bnb-testnet', walletId: null },
      opsSession: { authenticated: false, reviewer: '' },
      mintReqs: [],   // 双签队列：{nonce, assetId, amount, to, status: 'pending'|'approved', initiator, approver, at}
      burnReqs: [],
      navRecords: {}, // assetId -> {nav, dataTimestamp, signer, at}（NAVOracle 按 rwaToken 维度存）

      appointments: {

    let state = loadState();

    function clone(value) { return JSON.parse(JSON.stringify(value)); }
    function loadState() {

    // ---------- 迷你 keccak256（与 ethers.keccak256 / 合约 keccak256(bytes) 一致） ----------
    // 用途：metadataHash = keccak256(资产说明文档二进制内容)、documentHash = keccak256(证明文档内容)
    const keccak256Bytes = (() => {
      const MASK = (1n << 64n) - 1n;
      const RC = [0x0000000000000001n, 0x0000000000008082n, 0x800000000000808an, 0x8000000080008000n, 0x000000000000808bn, 0x0000000080000001n, 0x8000000080008081n, 0x8000000000008009n, 0x000000000000008an, 0x0000000000000088n, 0x0000000080008009n, 0x000000008000000an, 0x000000008000808bn, 0x800000000000008bn, 0x8000000000008089n, 0x8000000000008003n, 0x8000000000008002n, 0x8000000000000080n, 0x000000000000800an, 0x800000008000000an, 0x8000000080008081n, 0x8000000000008080n, 0x0000000080000001n, 0x8000000080008008n];
      // RHO[x + 5y] = 旋转量 r[x][y]
      const RHO = [0, 1, 62, 28, 27, 36, 44, 6, 55, 20, 3, 10, 43, 25, 39, 41, 45, 15, 21, 8, 18, 2, 61, 56, 14];
      const rotl = (x, n) => ((x << BigInt(n)) | (x >> BigInt(64 - n))) & MASK;
      function keccakF(state) {
        for (let round = 0; round < 24; round++) {
          // θ
          const C = new Array(5), D = new Array(5);
          for (let x = 0; x < 5; x++) C[x] = state[x] ^ state[x + 5] ^ state[x + 10] ^ state[x + 15] ^ state[x + 20];
          for (let x = 0; x < 5; x++) D[x] = C[(x + 4) % 5] ^ rotl(C[(x + 1) % 5], 1);
          for (let i = 0; i < 25; i++) state[i] ^= D[i % 5];
          // ρ
          for (let i = 1; i < 25; i++) state[i] = rotl(state[i], RHO[i]);
          // π：B[y, (2x+3y) mod 5] = A[x, y]
          const B = new Array(25);
          for (let y = 0; y < 5; y++) {
            for (let x = 0; x < 5; x++) B[y + 5 * ((2 * x + 3 * y) % 5)] = state[x + 5 * y];
          }
          // χ
          for (let y = 0; y < 5; y++) {
            for (let x = 0; x < 5; x++) {
              const i = x + 5 * y;
              state[i] = B[i] ^ ((~B[(x + 1) % 5 + 5 * y]) & B[(x + 2) % 5 + 5 * y]);
            }
          }
          // ι
          state[0] ^= RC[round];
        }
      }
      return function keccak256Bytes(input) {
        // input: Uint8Array → '0x' + 64 hex（keccak-256，pad10*1：0x01 ... 0x80）
        const rate = 136;
        const nBlocks = Math.ceil((input.length + 1) / rate);
        const padded = new Uint8Array(nBlocks * rate);
        padded.set(input);
        padded[input.length] = 0x01;
        padded[padded.length - 1] ^= 0x80;
        const state = new Array(25).fill(0n);
        for (let b = 0; b < nBlocks; b++) {
          for (let j = 0; j < rate / 8; j++) {
            let v = 0n;
            for (let k = 0; k < 8; k++) v |= BigInt(padded[b * rate + j * 8 + k]) << BigInt(8 * k);
            state[j] ^= v;
          }
          keccakF(state);
        }
        // squeeze 前 32 字节（rate 136 > 32，无需二次置换）
        let out = '0x';
        for (let j = 0; j < 4; j++) {
          let v = state[j];
          for (let k = 0; k < 8; k++) { out += (v & 0xffn).toString(16).padStart(2, '0'); v >>= 8n; }
        }
        return out;
      };
    })();
    // 从文件读取并计算 keccak256（file input change 时调用）
    function hashFileTo(fieldId, infoId, label) {
      const input = document.getElementById(fieldId);
      const file = input && input.files && input.files[0];

      file.arrayBuffer().then(buf => {
        const hash = keccak256Bytes(new Uint8Array(buf));
        const target = document.getElementById(infoId);
        if (target) {
          target.value = hash;
          target.dataset.generated = '1';

        toast(`${label} = keccak256(文档内容) 已生成：${hash.slice(0, 18)}…`);

    }
    function escapeHtml(value = '') { return String(value).replace(/[&<>'"]/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;' }[c])); }
    function shortAddress(address = '') { return address.length > 14 ? address.slice(0, 7) + '...' + address.slice(-5) : address; }

    const ASSET_REQUIRED_ROLES = [

    const VAULT_REQUIRED_ROLES = [
      { key: 'curator', label: 'Curator', fn: 'setCurator', hint: '策略与费用配置' },
      { key: 'guardian', label: 'Guardian', fn: 'setGuardian', hint: '紧急保护 / 取消待执行变更' },
      { key: 'allocator', label: 'Allocator', fn: 'setAllocator', hint: '资金分配与再平衡' },
      { key: 'keeper', label: 'Keeper', fn: 'setKeeper', hint: '周期推进与自动化维护' }
    ];
    function getAppointments(kind, id) { return (state.appointments[kind] || {})[id] || {}; }
    function missingRoles(kind, id, required) { const ap = getAppointments(kind, id); return required.filter(r => !ap[r.key]); }

    // ---------- 逐对象角色派生：角色 = 该对象的任命（地址匹配当前钱包），而非全局角色列表 ----------
    const KEY_TO_ROLE = { curator: 'curator', guardian: 'guardian', allocator: 'allocator', keeper: 'keeper', tokenAgent: 'token-agent', proofPublisher: 'proof-publisher' };
    function myAddr() { const w = wallet(); return w ? shortAddress(w.address) : ''; }
    function addrToWallet(addr) { return Object.values(WALLETS).find(w => shortAddress(w.address) === addr); }
    function holderName(addr) { const w = addrToWallet(addr); return w ? w.name.split(' ·')[0] : (addr || '未任命'); }
    function getSettlementOps(vaultId) { return state.settlementOps[vaultId] || { threshold: 0, operators: [], signatures: {}, history: [] }; }
    // 当前钱包在某 vault 是否持有某角色
    function holdsVaultRole(roleId, vaultId) {
      const vault = vaultById(vaultId); if (!vault) return false;
      const me = myAddr(); if (!me) return false;
      if (roleId === 'vault-owner') return vault.owner === me;
      if (roleId === 'settlement-operator') return getSettlementOps(vaultId).operators.includes(me);
      const ap = getAppointments('vaults', vaultId);
      const key = Object.keys(KEY_TO_ROLE).find(k => KEY_TO_ROLE[k] === roleId && ['curator', 'guardian', 'allocator', 'keeper'].includes(k));
      return key ? ap[key] === me : false;
    }
    function holdsAssetRole(roleId, assetId) {
      const asset = assetById(assetId); if (!asset) return false;
      const me = myAddr(); if (!me) return false;
      if (roleId === 'asset-owner') return asset.owner === me;
      const ap = getAppointments('assets', assetId);
      const key = Object.keys(KEY_TO_ROLE).find(k => KEY_TO_ROLE[k] === roleId && ['tokenAgent', 'proofPublisher'].includes(k));
      return key ? ap[key] === me : false;
    }
    // 某 vault 已任命的角色列表（含持有者地址），供侧栏展示；未任命的角色不出现
    function vaultAppointedRoles(vaultId) {
      const vault = vaultById(vaultId);
      const ap = getAppointments('vaults', vaultId);
      const out = [];
      if (vault) out.push({ roleId: 'vault-owner', address: vault.owner });
      for (const r of VAULT_REQUIRED_ROLES) if (ap[r.key]) out.push({ roleId: KEY_TO_ROLE[r.key], address: ap[r.key] });
      const ops = getSettlementOps(vaultId);
      if (ops.operators.length) out.push({ roleId: 'settlement-operator', multi: true });
      return out;
    }
    function assetAppointedRoles(assetId) {
      const asset = assetById(assetId);
      const ap = getAppointments('assets', assetId);
      const out = [];
      if (asset) out.push({ roleId: 'asset-owner', address: asset.owner });
      for (const r of ASSET_REQUIRED_ROLES) if (ap[r.key]) out.push({ roleId: KEY_TO_ROLE[r.key], address: ap[r.key] });
      return out;
    }
    // 某钱包持有的全部角色（按对象），供 My Access / 统计卡 / 连接面板派生；不传 walletId 时取当前连接钱包
    function walletRoleEntries(walletId) {
      const w = walletId ? WALLETS[walletId] : wallet();
      if (!w) return [];
      const me = shortAddress(w.address);
      const entries = [];
      for (const a of ASSETS) {
        for (const r of assetAppointedRoles(a.id)) if (r.address === me) entries.push({ roleId: r.roleId, kind: 'asset', id: a.id, name: a.name });
      }
      for (const v of VAULTS) {
        if (v.owner === me) entries.push({ roleId: 'vault-owner', kind: 'vault', id: v.id, name: v.name });
        const ap = getAppointments('vaults', v.id);
        for (const r of VAULT_REQUIRED_ROLES) if (ap[r.key] === me) entries.push({ roleId: KEY_TO_ROLE[r.key], kind: 'vault', id: v.id, name: v.name });
        if (getSettlementOps(v.id).operators.includes(me)) entries.push({ roleId: 'settlement-operator', kind: 'vault', id: v.id, name: v.name });
      }
      if ((w.rolesByNetwork[state.walletSession.network] || []).includes('governor')) entries.push({ roleId: 'governor', kind: 'protocol', id: 'protocol', name: 'HyperTessera Protocol' });
      return entries;
    }
    // Settlement 演示数据（队列 / 周期 / 资金）：真实实现来自 Indexer API
    function settlementDemoData(vaultId) {
      const seed = String(vaultId).split('').reduce((s, c) => s + c.charCodeAt(0), 0);
      const deposit = [], redeem = [];
      for (let i = 1; i <= 5; i++) deposit.push({ id: `D-${seed}${i}`, from: holderName(['0xB0b50...0B050', '0xDA7e0...00002', '0xE21n0...00003', '0x71A4c...A092C', '0xC4r0l...00001'][i % 5]) + ` #${i}`, amount: (i * 1200 + seed % 500).toFixed(0) });
      for (let i = 1; i <= 4; i++) redeem.push({ id: `R-${seed}${i}`, from: holderName(['0xDA7e0...00002', '0xE21n0...00003', '0xB0b50...0B050', '0xC4r0l...00001'][i % 4]) + ` #${i}`, amount: (i * 800 + seed % 300).toFixed(0) });
      const depositTotal = deposit.reduce((s, x) => s + Number(x.amount), 0);
      const redeemTotal = redeem.reduce((s, x) => s + Number(x.amount), 0);
      return { cycle: 3 + (seed % 4), phase: 'SETTLING', nav: '1.0186', deposit, redeem, depositTotal, redeemTotal, net: depositTotal - redeemTotal, poolAvailable: Math.max(depositTotal - redeemTotal, 0) + 5000, cap: depositTotal + 20000 };
    }

        { route: '#/vaults/manage', name: '管理金库', desc: '金库列表 → 金库详情（角色工作台：左侧我的角色 + 右侧操作区 / Activity）。', perm: 'Vault Owner' },
      ]},
      { group: '内部运营', kicker: 'Ops', items: [
        { route: '#/ops/login', name: '审核后台登录', desc: '独立账号密码，不连接钱包。', perm: '账号密码' },
        { route: '#/ops/dashboard', name: '审核 Dashboard', desc: '审核队列 / 已上架 Vault / 审核历史。', perm: 'Ops 账号' },
      ]}
    ];

    // 页面跳转关系（入口 → 目标 + 触发条件）
    const EDGES = [
      { from: '顶部导航 · 资产发行', to: '发行子页面（3 标签页）', via: 'hover 下拉', cond: '鼠标悬停「资产发行」大模块，菜单不可点击进入' },
      { from: '发行子页面', to: '发行 / 包装或解包装 / 工作台', via: '标签页切换', cond: '3 个标签页：发行注册表单、包装兑换、资产工作台' },
      { from: '发行新资产代币', to: '资产详情', via: '注册成功自动跳转', cond: 'registerAsset 成功后进入 Asset Owner 视角' },
      { from: '资产详情', to: 'Mint/Burn 双签工作台', via: '操作按钮', cond: '点击「发起 Mint」或「发起 Burn」' },
      { from: '资产详情', to: '储备证明', via: '操作按钮', cond: '点击「发布储备证明」（资产 Owner 或任命的 Publisher）' },
      { from: '资产管理', to: '创建金库 / 管理金库', via: 'hover 下拉', cond: '创建开放（需官方 Factory）；管理需 vault-owner 角色' },
      { from: '管理金库', to: '金库详情', via: '对象列表', cond: '点击自己的金库' },
      { from: '金库详情', to: '预言机数据', via: '操作按钮', cond: '点击「更新 NAV」（rwaToken 授权 Signer）' },
      { from: '金库详情', to: '审核后台', via: '上架申请', cond: 'Vault Owner 提交 → 内部 Ops 账号审核' },
    ];

    function renderBlueprint() {
      return `${publicHeader('')}<main class="page">
        <div class="page-head"><div><div class="eyebrow">Information architecture</div><h1>页面蓝图与操作流程</h1><p>全部页面按四个身份边界分组；每个页面标注路由、权限要求与对应的合约函数。下方是页面跳转关系与三条核心操作流程。</p></div><button class="btn secondary" data-route="#/">返回首页</button></div>

        <section class="section">
          <div class="section-title"><div><div class="eyebrow">Sitemap</div><h2>信息架构：资产发行 3 标签页 / 4 个域</h2></div><span class="badge neutral">资产发行为导航大模块，hover 展开</span></div>
          <div class="sitemap-grid">${SITEMAP.map(domain => `<div class="card card-pad"><div class="entry-kicker" style="margin-bottom:14px">${domain.kicker} · ${domain.group}</div><div class="stack">${domain.items.map(item => `<div class="req-item" style="flex-direction:column;align-items:stretch"><div class="req-main"><h4>${item.name}</h4><p>${item.desc}</p><div class="row wrap" style="margin-top:8px"><span class="route">${item.route}</span>${item.perm ? `<span class="role-chip">${item.perm}</span>` : ''}</div></div></div>`).join('')}</div></div>`).join('')}</div>
        </section>

        <section class="section card card-pad">
          <div class="section-title"><div><div class="eyebrow">Navigation graph</div><h2>页面跳转关系</h2></div><span class="badge neutral">入口 → 目标 + 触发条件</span></div>
          <div class="edge-list">${EDGES.map(e => `<div class="edge-row"><div class="edge-from">${e.from}</div><div class="edge-via">→ ${e.via} →</div><div class="edge-to">${e.to}</div><div class="edge-cond">${e.cond}</div></div>`).join('')}</div>
        </section>

        <section class="section">
          <div class="section-title"><div><div class="eyebrow">Core flows</div><h2>三条核心操作流程</h2></div></div>
          <div class="stack">
            <article class="card card-pad"><div class="row between wrap" style="margin-bottom:14px"><h3>流程 A · 资产发行与 Mint 双签</h3>${callTag('AssetRegistry.registerAsset')} ${callTag('MintBurnController.initiateMint / approveMint')}</div>
              ${flowBar([{t:'注册资产', d:'registerAsset(metadataHash, name, symbol, decimals)，无许可，注册者成为 Asset Owner，同交易部署专属 RWAToken'},{t:'发起 Mint', d:'Issuer（资产 owner）调 initiateMint(assetId, amount, to)，生成待批准请求 MintInitiated(nonce)'},{t:'批准 Mint', d:'Token Agent（setTokenAgent 任命）调 approveMint(nonce)，请求批准并执行 rwaToken.mint()'},{t:'资产上链', d:'MintApproved 事件落账，Token 余额到账，Asset Owner 可继续管理元数据'}], 0)}
              <p class="small muted" style="margin:12px 0 0">演示路径：资产发行中心 → 发行新资产代币 → 管理已发行资产代币 → 资产详情 → Mint/Burn 双签工作台（发起 → 切换 Bob 批准）。</p>
            </article>
            <article class="card card-pad"><div class="row between wrap" style="margin-bottom:14px"><h3>流程 B · 包装资产兑换（ReservePSM 双模式）</h3>${callTag('ReservePSM.wrap / unwrap')} ${callTag('ReservePSM.mintWithAuthorization')}</div>
              ${flowBar([{t:'部署包装资产', d:'任何账户调 deployWrappedToken(assetId, mode, underlyingToken, name, symbol, decimals, allowPartialUnwrap)，部署者成为 Wrapper Controller'},{t:'Wrap 兑换', d:'Custody：wrap 托管底层 1:1 铸包装代币；Proof：PSM Authorized Signer 签名后 mintWithAuthorization'},{t:'自由流转', d:'WrappedAsset 为普通 ERC-20，除 PSM 外自由转账'},{t:'Unwrap 赎回', d:'Custody 按比例返还底层；Proof 仅支持全额赎回并触发 ReleaseRequested 供链外释放'}], 0)}
              <p class="small muted" style="margin:12px 0 0">演示路径：资产发行中心 → 包装或解包装（选择资产 → wrap / unwrap，切换 Bob 演示签名铸币）。</p>
            </article>
            <article class="card card-pad"><div class="row between wrap" style="margin-bottom:14px"><h3>流程 C · 创建金库（开放部署）</h3>${callTag('VaultFactory.deployVault')} ${callTag('StateManager.registerVault')}</div>
              ${flowBar([{t:'指定官方 Factory', d:'Governor 调 StateManager.setVaultFactory(factory)，官方 Factory 地址写入 StateManager'},{t:'用户调用部署', d:'任何用户调 VaultFactory.deployVault(VaultParams 14 字段，adapterRegistry 必填、owner 可空)，无需角色；Factory 部署 Vault + Timelock'},{t:'Factory 注册', d:'Factory 调 StateManager.registerVault，校验 msg.sender == vaultFactory 地址匹配'},{t:'创建者成为 Owner', d:'VaultDeployed 事件落账，创建者（或 params.owner）获得该金库 Owner 身份'}], 0)}
              <p class="small muted" style="margin:12px 0 0">先决条件：Governor 调 StateManager.setVaultFactory 指定官方 Factory。演示路径：资产管理中心 → 创建金库 → 管理金库（创建者视角）。</p>
            </article>
          </div>
        </section>
      </main>`;
    }

    // ---------- Products（公开域，简化保留） ----------
    function vaultCard(vault) {
      return `<article class="card card-pad"><div class="row between wrap"><div><div class="small quiet">${vault.network} · ${vault.symbol} · ${vault.type}</div><h3 style="margin-top:4px">${escapeHtml(vault.name)}</h3></div>${statusBadge(vault.status === 'listed' ? 'listed' : vault.status === 'submitted' ? 'submitted' : 'pending')}</div><p class="small">底层资产 ${vault.id === 'vault-alpha' ? 'US Treasury Bills' : 'Private Credit'} · 指示 APY ${vault.id === 'vault-alpha' ? '5.18%' : '8.42%'}</p><button class="btn secondary small" data-route="#/vaults/manage/${vault.id}">查看产品详情</button></article>`;
    }
    function renderProducts() {
      return `${publicHeader('products')}<main class="page">
        <div class="page-head"><div><div class="eyebrow">Products</div><h1>已上架 Vault</h1><p>仅展示通过网站运营审核的产品。网站上架不代表协议担保，不改变链上状态。</p></div></div>
        <div class="grid three">${VAULTS.filter(v => v.status === 'listed').map(vaultCard).join('') || '<div class="empty card" style="grid-column:1/-1"><h3>暂无已上架产品</h3></div>'}</div>
      </main>`;
    }

    // ---------- 钱包连接 ----------
    function renderConnectPanel(title) {
      return `${publicHeader('access')}<main class="page"><div class="page-head"><div><div class="eyebrow">Wallet access</div><h1>${title}</h1><p>先选择网络并连接演示账户，系统将按「网络 + 钱包」查询该账户拥有的角色，只展示可执行的工作台。</p></div></div>
        <section class="connect-panel card">
          <div class="connect-copy"><div class="eyebrow">Demo identities</div><h2>选择一个演示账户</h2><p>不同账户展示不同权限组合。切换网络后角色列表同步更新。</p><div class="field"><label for="connect-network" style="color:#c8d7e8">网络</label><select id="connect-network" class="select" data-connect-network>${NETWORKS.map(n => `<option value="${n.id}" ${n.id === state.walletSession.network ? 'selected' : ''}>${n.label}</option>`).join('')}</select></div></div>
          <div class="account-list">${Object.entries(WALLETS).map(([id, account]) => `<button class="account-option" data-connect-wallet="${id}"><div><strong>${escapeHtml(account.name)}</strong><span class="mono">${escapeHtml(shortAddress(account.address))}</span></div><span class="badge neutral">${walletRoleEntries(id).length} 个角色</span></button>`).join('')}</div>
        </section>
      </main>`;
    }

    // ---------- My Access（权限聚合：按逐对象任命派生，同一角色在不同对象里分别列出） ----------
    function renderAccess() {
      if (!wallet()) return renderConnectPanel('My Access');
      const entries = walletRoleEntries();
      const groupLabels = { vault: '资产管理角色', issuance: '资产发行角色', functional: '功能身份', protocol: '协议治理角色' };
      const grouped = ['vault', 'issuance', 'functional', 'protocol'].map(g => ({ group: g, items: entries.filter(en => ROLES[en.roleId]?.group === g) })).filter(x => x.items.length);
      const vaultCount = new Set(entries.filter(e => e.kind === 'vault').map(e => e.id)).size;
      const assetCount = new Set(entries.filter(e => e.kind === 'asset').map(e => e.id)).size;
      const target = en => en.kind === 'vault' ? `#/workspace/${en.roleId}/${en.id}` : en.kind === 'asset' ? `#/assets/workspace/${en.id}/${en.roleId}` : '#/blueprint';
      return `${publicHeader('access')}<main class="page">
        <div class="page-head"><div><div class="eyebrow">My Access</div><h1>当前账户的权限与待办</h1><p>权限由「逐对象任命」派生：同一个角色在不同 Vault / 资产里分别计数，未任命的对象不会显示。</p></div><div class="row"><button class="btn secondary" data-open-wallet>切换账户</button></div></div>
        ${contextBar()}
        <div class="grid four"><div class="stat card"><div class="stat-label">可操作角色</div><div class="stat-value">${entries.length}</div><div class="stat-foot">按对象派生</div></div><div class="stat card"><div class="stat-label">可操作 Vault</div><div class="stat-value">${vaultCount}</div><div class="stat-foot">对象级权限</div></div><div class="stat card"><div class="stat-label">可操作资产</div><div class="stat-value">${assetCount}</div><div class="stat-foot">对象级权限</div></div><div class="stat card"><div class="stat-label">今日操作</div><div class="stat-value">${state.activities.length}</div><div class="stat-foot">Activity</div></div></div>
        <section class="section grid two">
          <article class="card card-pad"><div class="section-title"><h3>权限清单</h3><span class="badge neutral">只显示已任命</span></div>${grouped.length ? grouped.map(item => `<div class="side-label" style="padding-left:0;margin-top:12px;font-size:11px;font-weight:800;color:var(--quiet);text-transform:uppercase;letter-spacing:.09em">${groupLabels[item.group]}</div><div class="stack">${item.items.map(en => `<button class="account-option" data-route="${target(en)}"><div><strong>${ROLES[en.roleId].label}</strong><span>${en.kind === 'protocol' ? '协议治理' : escapeHtml(en.name)}</span></div><span class="badge">进入</span></button>`).join('')}</div>`).join('') : `<div class="empty"><h3>当前账户没有被任命任何角色</h3><p>仍可使用无许可功能：注册资产、包装兑换、创建金库。</p><button class="btn secondary" data-route="#/issuance/issue">进入资产发行</button></div>`}</article>
          <article class="card card-pad"><div class="section-title"><h3>优先待办</h3><span class="badge warning">按对象聚合</span></div>${entries.length ? `<div class="stack">${entries.slice(0, 6).map(en => `<button class="account-option" data-route="${target(en)}"><div><strong>${ROLES[en.roleId].label}</strong><span>${en.kind === 'protocol' ? ROLES[en.roleId].contract : escapeHtml(en.name) + ' · ' + ROLES[en.roleId].contract.split('（')[0]}</span></div><span class="badge">前往</span></button>`).join('')}</div>` : `<div class="empty"><h3>无角色待办</h3><p>切换到 Alice / Bob / Dan / Erin 查看不同角色的演示。</p></div>`}</article>
        </section>
      </main>`;
    }

    // ---------- 角色工作台（统一分发器：按角色 → 对应业务页） ----------
    function renderWorkspace(roleId, objectId) {
      if (!wallet()) return renderConnectPanel('角色工作台');
      if (!ROLES[roleId]) return renderNotFound('未知角色');
      const role = ROLES[roleId];
      // 金库域角色：进入金库角色工作台（双栏布局，左侧「我的角色」可切换）
      if (role.group === 'vault') return vaultRoleWorkspace(roleId, objectId || (VAULTS[0] && VAULTS[0].id));
      // 资产发行 / 功能身份角色：进入资产角色工作台（双栏布局，左侧角色侧栏）
      if (role.group === 'issuance' || role.group === 'functional') return assetRoleWorkspace(roleId, objectId ? Number(objectId) : (ASSETS[0] && ASSETS[0].id));
      // 协议治理角色
      const obj = roleObject(roleId);
      const target = '#/blueprint';
      return `${publicHeader(role.group === 'vault' ? 'vaults' : 'issuance')}<main class="page">
        ${contextBar(`<div class="context-item"><span>Object</span><strong>${escapeHtml(obj?.name || 'Protocol')}</strong></div><div class="context-item"><span>Role</span><strong>${role.label}</strong></div>`)}
        <div class="page-head"><div><div class="eyebrow">${role.scope} workspace</div><h1>${role.label}</h1><p>${role.summary}</p></div><div class="row"><span class="badge success">权限已确认</span></div></div>
        <section class="card card-pad"><div class="row between wrap"><div><strong>权限来源</strong><div class="small muted" style="margin-top:4px">${networkLabel()} · ${shortAddress(wallet().address)} · ${escapeHtml(obj?.address || 'Protocol')}</div></div><span class="call-tag">${role.contract}</span></div></section>
        <section class="section card card-pad"><div class="section-title"><h3>可执行操作</h3><span class="badge neutral">合约映射</span></div><div class="stack">${role.actions.map((action, i) => `<div class="req-item"><div class="req-main"><h4>${action}</h4><p>${role.contract} · ${i === 0 ? '演示版记录 Activity 并跳转对应页面' : '对应合约函数见右侧说明'}</p></div><button class="btn ${i ? 'secondary' : ''} small" data-route="${target}">进入操作</button></div>`).join('')}</div></section>
      </main>`;
    }

    // =====================================================================
    //  资产发行域（Issuance）：register → manage → mint/burn → oracle → por → wrap
    // =====================================================================

    // ---------- 发行（子页面）：3 个标签页（发行 / 包装/解包装 / 工作台） ----------
    function renderIssueCenter() {
      if (!wallet()) return renderConnectPanel('资产发行');
      const tab = state.activeIssuanceTab || 'issue';
      return `${publicHeader('issuance', tab)}<main class="page">
        <div class="page-head"><div><div class="eyebrow">Issuance Hub</div><h1>资产发行</h1><p>三个标签页覆盖资产全生命周期：注册新资产、包装/解包装兑换、以及工作台中的角色管理操作。</p></div></div>
        ${sectionTabs(tab)}
        ${contextBar()}
        ${tab === 'issue' ? renderIssueTabContent() : tab === 'wrap' ? renderIssueWrapTab() : renderIssuanceWorkspace()}
      </main>`;
    }

    // 发行标签页：inline registerAsset 表单
    function renderIssueTabContent() {
      const steps = [{ t: '填写资产信息', d: 'name / symbol / decimals 与链上元数据哈希' }, { t: '调用 registerAsset', d: '无许可，任何人可注册，同交易部署专属 RWAToken' }, { t: '成为 Asset Owner', d: '注册者自动获得该资产 owner 身份' }, { t: '进入资产详情', d: '可继续更新元数据 / 发起双签' }];
      return `<div class="stack">
        <section class="card card-pad">
          <div class="section-title"><h3>发行新资产代币</h3>${callTag('AssetRegistry.registerAsset(metadataHash, name, symbol, decimals)')}</div>
          <div class="flowbar" style="margin-bottom:18px">${flowBar(steps, 0)}</div>
          <form id="reg-form" class="form-grid">
            <div class="field full"><label for="reg-name">资产名称 *</label><input id="reg-name" class="input" name="name" required placeholder="如：US Treasury Token"></div>
            <div class="field"><label for="reg-symbol">代币符号 *</label><input id="reg-symbol" class="input" name="symbol" required placeholder="如：htUST"></div>
            <div class="field"><label for="reg-decimals">小数位数</label><input id="reg-decimals" class="input" name="decimals" type="number" min="0" max="18" value="18"></div>
            <div class="field full"><label for="reg-file">上传资产说明文档（链下存储，仅用于计算哈希）</label>
              <div class="row" style="gap:10px"><input id="reg-file" class="input" type="file" accept=".pdf,.doc,.docx,.md,.txt,.json,.xlsx" data-reg-file style="flex:1"><button class="btn small secondary" type="button" data-reg-file-btn>生成 metadataHash</button></div>
              <p class="small quiet" style="margin:6px 0 0">metadataHash = keccak256(文档二进制内容)；文档 URI 随后通过 PoRRegistry.publishReserveProof 记录。</p>
            </div>
            <div class="field full"><label for="reg-hash">元数据哈希 metadataHash *</label><input id="reg-hash" class="input mono" name="metadataHash" required placeholder="0x + 64 位十六进制（keccak256）" style="font-size:12px"><p class="small quiet" style="margin:6px 0 0">选择上方文档后自动计算，或手动填写。</p></div>
            <div class="field full"><button class="btn" type="submit">提交注册</button><p class="small quiet" style="margin-top:8px">注册后自动成为 Asset Owner，可进入「工作台」标签页管理。</p></div>
          </form>
        </section>
        <section class="card card-pad"><div class="section-title"><h3>注册后的自动行为</h3></div><div class="edge-list">
          <div class="edge-row"><div class="edge-from">registerAsset</div><div class="edge-via">→ 同交易</div><div class="edge-to">部署专属 RWAToken</div><div class="edge-cond">RWAToken 由注册者控制，随后 Mint 需双签</div></div>
          <div class="edge-row"><div class="edge-from">AssetRegistered 事件</div><div class="edge-via">→ 落账</div><div class="edge-to">assetId = registry 内序号</div><div class="edge-cond">事件参数：assetId / owner / token / metadataHash / timestamp</div></div>
          <div class="edge-row"><div class="edge-from">注册者</div><div class="edge-via">→ 自动成为</div><div class="edge-to">Asset Owner</div><div class="edge-cond">onlyOwner 函数：updateMetadataHash / transferAssetOwnership / deactivateAsset</div></div>
        </div></section>
      </div>`;
    }

    // 包装/解包装标签页：inline 兑换表单
    function renderIssueWrapTab() {
      const modeCards = [
        { mode: 'Token Custody', desc: 'wrap 时底层资产 1:1 托管进 PSM，铸包装代币；unwrap 按比例返还底层。', tag: 'wrap / unwrap' },
        { mode: 'Document Proof', desc: '链上不托管底层资产；wrap 需 PSM Authorized Signer 签名的 mintWithAuthorization；unwrap 仅支持全额并触发 ReleaseRequested。', tag: 'mintWithAuthorization' }
      ];
      return `<div class="stack">
        <div class="grid two">${modeCards.map(m => `<article class="card card-pad"><div class="section-title"><h3>${m.mode}</h3>${callTag(m.tag)}</div><p class="small muted">${m.desc}</p></article>`).join('')}</div>
        <section class="card card-pad"><div class="section-title"><h3>兑换操作</h3>${callTag('ReservePSM.wrap / unwrap / mintWithAuthorization')}</div>
          <form id="wrap-form" class="form-grid">

    // 工作台标签页：资产表格 + 角色入口（类似资产管理中心）

      const myAssets = ASSETS.filter(a => a.owner === myAddr());
      const allAssets = ASSETS.map(a => {
        const ws = state.issuanceWorkspaceAssets.find(x => x.id === a.id);
        return { ...a, type: ws?.type || a.type || 'Token Custody', status: ws?.status || (a.active ? 'active' : 'paused') };

        <div class="grid four">
          <div class="stat card"><div class="stat-label"><span class="dot"></span>发行角色</div><div class="stat-value">${issuanceRoles.length}</div><div class="stat-foot">按对象派生</div></div>
          <div class="stat card"><div class="stat-label"><span class="dot success"></span>功能身份</div><div class="stat-value">${funcRoles.length}</div><div class="stat-foot">Function 域</div></div>
          <div class="stat card"><div class="stat-label"><span class="dot warning"></span>我的资产</div><div class="stat-value">${myAssets.length}</div><div class="stat-foot">Asset Owner</div></div>

        <section class="card"><div class="section-title card-pad" style="margin-bottom:0;padding-bottom:0"><div class="eyebrow">Issuance assets</div><h3>资产工作台</h3></div><div class="table-wrap"><table><thead><tr><th>资产</th><th>合约地址</th><th>类型</th><th>状态</th><th>操作</th></tr></thead><tbody>${allAssets.length ? allAssets.map(a => `<tr><td><strong>${escapeHtml(a.name)}</strong><div class="small quiet mono">${a.symbol} · assetId #${a.id}</div></td><td class="mono small">${a.token}</td><td><span class="role-chip">${a.type}</span></td><td>${statusBadge(a.status)}</td><td><button class="table-link" data-route="#/assets/workspace/${a.id}">进入工作台 →</button></td></tr>`).join('') : `<tr><td colspan="5" class="empty"><h3>暂无资产</h3><p>切换到「发行」标签页注册第一个资产。</p><button class="btn" data-route="#/assets/register">去发行</button></td></tr>`}</tbody></table></div></section>
        <p class="small quiet">点击「进入工作台 →」后先选定资产，左侧会列出当前钱包在该资产下具备的全部角色（发行 + 功能身份），再点角色进入对应操作面板，与「管理金库」的交互一致。</p>
      </div>`;

    // ---------- 资产详情（委托给资产角色工作台：双栏布局，左侧角色侧栏） ----------
    function renderAssetDetail(id) {
      const asset = assetById(id);

      return assetRoleWorkspace(defaultAssetRole(id), id);

    // ---------- Mint / Burn 双签工作台 ----------
    function reqRow(type, req) {
      const label = type === 'mint' ? 'Mint' : 'Burn';
      const asset = assetById(req.assetId);
      const canApprove = holdsAssetRole('token-agent', req.assetId) && req.status === 'pending';
      return `<div class="req-item"><div class="req-main"><h4>${label} #${req.nonce} · ${escapeHtml(asset?.name || '未知资产')} ${callTag(type === 'mint' ? 'initiateMint' : 'initiateBurn')}</h4><p class="mono">amount ${req.amount} → ${req.to} · 发起人 ${shortAddress(req.initiator)}${req.approver ? ' · 批准人 ' + shortAddress(req.approver) : ''} · ${new Date(req.at).toLocaleTimeString()}</p></div><div class="row wrap">${req.status === 'approved' ? statusBadge('approved') : statusBadge('pending')}${canApprove ? `<button class="btn success small" data-approve="${type}:${req.nonce}">批准（Token Agent）</button>` : ''}</div></div>`;
    }
    function renderMintBurn(id) {
      const asset = assetById(id);
      if (!asset) return renderNotFound('资产不存在');
      if (!wallet()) return renderConnectPanel('Mint / Burn 双签');
      const canInitiate = holdsAssetRole('asset-owner', asset.id);
      const pendingMints = state.mintReqs.filter(r => r.assetId === asset.id);
      const pendingBurns = state.burnReqs.filter(r => r.assetId === asset.id);
      return `${publicHeader('issuance', 'manage-assets')}<main class="page">
        <div class="page-head"><div><div class="eyebrow">Dual signature</div><h1>Mint / Burn 双签工作台 <span class="mono quiet" style="font-size:18px">${asset.symbol}</span></h1><p>Issuer 发起申请 → Token Agent 批准执行，两个独立角色缺一不可。演示：先用 Alice 发起，再切换到 Bob 批准。</p></div><div class="row"><button class="btn secondary" data-route="#/assets/manage/${asset.id}">返回资产详情</button></div></div>
        ${contextBar(`<div class="context-item"><span>Object</span><strong>${asset.symbol}</strong></div><div class="context-item"><span>Issuer</span><strong>${holdsAssetRole('asset-owner', asset.id) ? '当前账户' : '未持有'}</strong></div><div class="context-item"><span>Token Agent</span><strong>${holdsAssetRole('token-agent', asset.id) ? '当前账户' : '未持有'}</strong></div>`)}
        <div class="work-layout">
          <div class="stack">
            <section class="card card-pad">
              <div class="section-title"><h3>发起 ${canInitiate ? '（Issuer）' : '（需要 Issuer 角色）'}</h3>${callTag('MintBurnController.initiateMint / initiateBurn')}</div>
              <div class="grid two">
                <form id="mint-form" class="field"><label>发起 Mint</label><div class="row"><input class="input" name="amount" type="number" min="1" step="any" placeholder="数量" required><input class="input mono" name="to" placeholder="接收地址" value="${escapeHtml(shortAddress(wallet().address))}" required></div><button class="btn small" type="submit" ${canInitiate ? '' : 'disabled'} style="margin-top:10px">发起 Mint（第一签名）</button></form>
                <form id="burn-form" class="field"><label>发起 Burn</label><div class="row"><input class="input" name="amount" type="number" min="1" step="any" placeholder="数量" required><input class="input mono" name="from" placeholder="销毁来源地址（initiateBurn 的 from）" value="${escapeHtml(shortAddress(wallet().address))}" required></div><button class="btn small secondary" type="submit" ${canInitiate ? '' : 'disabled'} style="margin-top:10px">发起 Burn（第一签名）</button></form>
              </div>
              <p class="small quiet" style="margin-top:10px">PR#12 的 initiateMint / approveMint 无签名参数：Issuer = 资产 Owner（ownerOf），Token Agent = Owner 通过 setTokenAgent 任命的地址。</p>
            </section>
            <section class="card card-pad"><div class="section-title"><h3>Mint 队列</h3><span class="badge">${pendingMints.length}</span></div><div class="req-list">${pendingMints.length ? pendingMints.map(r => reqRow('mint', r)).join('') : '<div class="empty" style="padding:22px"><h3 style="font-size:15px">暂无 Mint 请求</h3><p>由 Issuer 发起后出现在这里。</p></div>'}</div></section>
            <section class="card card-pad"><div class="section-title"><h3>Burn 队列</h3><span class="badge">${pendingBurns.length}</span></div><div class="req-list">${pendingBurns.length ? pendingBurns.map(r => reqRow('burn', r)).join('') : '<div class="empty" style="padding:22px"><h3 style="font-size:15px">暂无 Burn 请求</h3><p>由 Issuer 发起后出现在这里。</p></div>'}</div></section>
          </div>
          ${sidePanel({ contract: 'MintBurnController', permission: '发起：资产 Owner（Issuer）· 批准：setTokenAgent 任命的 Token Agent', permissionNote: 'Issuer 与 Token Agent 是两个独立地址（owner 与任命者），双签确保铸销需两方协作', pre: '资产已注册（registerAsset 时内部部署并登记 MintBurnController）', events: 'MintInitiated(nonce) → MintApproved(nonce)；BurnInitiated(nonce) → BurnApproved(nonce)', next: '批准后自动执行 rwaToken.mint / burn，可返回资产详情查看', note: '演示：Alice 发起后请切换 Bob（token-agent）账户批准，才能看到 MintApproved。' })}
        </div>
      </main>`;
    }

    // ---------- 预言机数据（NAV） ----------
    function renderOracle() {
      if (!wallet()) return renderConnectPanel('预言机数据');
      const rows = Object.entries(state.navRecords);
      const steps = [{ t: '选择资产代币', d: '每个 rwaToken 有独立授权签名者（setSigner）' }, { t: 'EIP-712 签名', d: 'domain {name: NAVOracle, version: 1}；结构 NAVUpdate(rwaToken, price, dataTimestamp)' }, { t: '提交 updateNAV', d: '任何人可 relay：updateNAV(rwaToken, price, dataTimestamp, signature)' }, { t: 'NAV 落账', d: '校验签名、非零、非未来、单调递增与 +20% 上限后写入' }];

        ${contextBar(`<div class="context-item"><span>Signer</span><strong>${hasRole('nav-signer') ? '当前账户（rwaToken 授权签名者）' : '未持有 nav-signer'}</strong></div>`)}
        <div class="work-layout">
          <div class="stack">
            <section class="card card-pad">
              <div class="section-title"><h3>提交 NAV 更新</h3>${callTag('NAVOracle.updateNAV(rwaToken, price, dataTimestamp, signature)')}</div>
              <div class="flowbar" style="margin-bottom:18px">${flowBar(steps, 0)}</div>
              <form id="nav-form" class="form-grid">
                <div class="field"><label for="nav-token">资产代币 rwaToken *</label><select id="nav-token" class="select" name="rwaToken" data-nav-token>${ASSETS.map(a => `<option value="${a.id}">${escapeHtml(a.name)}（${a.symbol} · ${a.token}）</option>`).join('')}</select></div>
                <div class="field"><label for="nav-value">NAV 数值 price *</label><input id="nav-value" class="input mono" name="nav" type="number" min="0.000001" step="any" placeholder="如 1.0186" required><p class="small quiet" style="margin-top:4px">合约要求 price &gt; 0（price == 0 直接 InvalidNAV）</p></div>
                <div class="field full"><label for="nav-ts">数据时间戳 dataTimestamp（unix 秒）*</label><input id="nav-ts" class="input mono" name="dataTimestamp" value="${Math.floor(Date.now() / 1000)}" required><p class="small quiet" style="margin-top:4px">必须 ≤ 当前时间（dataTimestamp &gt; now 触发 FutureData），且较上次记录单调递增</p></div>
                <div class="field full"><label>EIP-712 签名（演示预览）</label><div class="mono small muted" style="padding:10px 12px;background:var(--surface-soft);border:1px solid var(--line);border-radius:9px">typehash = keccak256("NAVUpdate(address rwaToken,uint256 price,uint256 dataTimestamp)")；domain = EIP712("NAVOracle", "1")；由 NAVOracle owner 通过 setSigner 任命的 Signer 私钥签名；本演示以角色判定代替真实签名</div></div>
                <div class="field full"><button class="btn" type="submit" ${hasRole('nav-signer') ? '' : 'disabled'}>提交 NAV（签名者）</button>${hasRole('nav-signer') ? '' : '<p class="error-text">当前账户未持有 nav-signer（需 NAVOracle owner 通过 setSigner 任命），请切换到 Alice。</p>'}</div>
              </form>
            </section>
            <section class="card"><div class="card-pad section-title"><h3>NAV 历史记录</h3><span class="badge">${rows.length}</span></div><div class="table-wrap"><table><thead><tr><th>资产代币</th><th>NAV</th><th>数据时间戳</th><th>签名者</th><th>提交时间</th></tr></thead><tbody>${rows.length ? rows.map(([assetId, rec]) => { const a = assetById(assetId); return `<tr><td><strong>${escapeHtml(a?.name || '#' + assetId)}</strong><div class="small quiet mono">${a ? a.token : ''}</div></td><td class="mono">${rec.nav}</td><td class="mono small">${rec.dataTimestamp}</td><td class="mono small">${shortAddress(rec.signer)}</td><td class="small">${rec.at ? new Date(rec.at).toLocaleTimeString() : '—'}</td></tr>`; }).join('') : `<tr><td colspan="5" class="empty"><h3>暂无 NAV 记录</h3><p>提交第一条 NAV 后在此展示。</p></td></tr>`}</tbody></table></div></section>
          </div>
          ${sidePanel({ contract: 'NAVOracle.updateNAV', permission: '提交：无许可 relay；签名：NAVOracle owner 通过 setSigner(rwaToken, signer) 授权（部署脚本中 owner=Governor）', permissionNote: 'digest = EIP-712（domain: NAVOracle v1）签名结构 NAVUpdate(rwaToken, price, dataTimestamp)；授权管理 setSigner / removeSigner / transferOwnership（仅 NAVOracle owner）', pre: '资产已注册且其 rwaToken 已绑定授权 Signer', events: 'NAVUpdated(rwaToken, price, dataTimestamp, updatedAt, signer)', next: '资产详情 / 金库详情展示最新 NAV', note: 'price=0、时间戳为未来、时间戳未递增、或较上次价格上涨超 20% 均会被合约拒绝。' })}

    // ---------- 储备证明（PoR） ----------
    function renderPor() {
      if (!wallet()) return renderConnectPanel('储备证明');
      // PoRRegistry：资产 owner 或该资产任命的 proofPublisherOf（逐对象权限，随所选资产变化）
      const selAssetId = state.activePorAsset != null ? Number(state.activePorAsset) : (ASSETS[0] && ASSETS[0].id);
      const canPublish = holdsAssetRole('proof-publisher', selAssetId) || holdsAssetRole('asset-owner', selAssetId);
